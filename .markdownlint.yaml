default: true

line-length:
  line_length: 160
  heading_line_length: 80
  stern: false
  tables: false
  code_blocks: false

no-duplicate-heading:
  siblings_only: true

no-trailing-punctuation:
  punctuation: '.,;:'

heading-style:
  style: atx

ul-style:
  style: dash

ol-prefix:
  style: ordered

no-inline-html:
  allowed_elements:
    - details
    - summary
    - br
    - a
    - img
    - sup

emphasis-style:
  style: underscore

strong-style:
  style: asterisk

table-column-style:
  aligned_delimiter: true
  style: aligned
