summary:
  goals:
    text: >-
      Keep Connext IDL generation in the .NET build and extend compatibility
      through evidence-backed language and runtime cases.
    sources:
      - docs/architecture/arc42/01-introduction-and-goals.md
  constraints:
    text: >-
      Repository projects target net10.0. The Roslyn adapter and shared,
      non-packable compiler target netstandard2.0 for the .NET 8, C# 12 host
      with Roslyn 4.8.0. Consumers require RTI 7.3.1 or later; exact
      qualification targets are 7.3.1 and 7.7.0.
    sources:
      - docs/architecture/arc42/02-architecture-constraints.md
  context:
    text: >-
      Wireloom is a compile-time generator between consumer projects and
      generated C#; it is outside the DDS runtime data path and does not provide
      RTI support.
    sources:
      - docs/architecture/arc42/03-context-and-scope.md
  strategy:
    text: >-
      OMG IDL and DDS-XTypes define language semantics; RTI captures provide
      versioned compatibility evidence. A host-neutral in-memory compiler
      accepts an explicit profile and returns documents with diagnostics. The
      Roslyn adapter resolves the RTI version and owns diagnostics and source
      registration. The pipeline separates preprocessing, parsing, binding,
      validation, profile-specific planning, and emission.
    sources:
      - docs/architecture/arc42/04-solution-strategy.md
  building_blocks:
    text: >-
      The compiler core owns virtual inputs, IDL syntax, symbols, semantic
      validation, diagnostics, and generated documents without Roslyn, MSBuild,
      RTI, or filesystem dependencies. The adapter owns Roslyn integration and
      profile discovery. Parsing preserves annotation order and source spans;
      binding resolves constants, defaults, bounds, enum identity, and member
      IDs. Validation is profile-independent. Emission plans own profile- and
      IDL-shape-specific API, storage, metadata, and initialization. Detailed
      feature behavior is maintained in chapter 8, contracts, and corpus
      coverage.
    sources:
      - docs/architecture/arc42/05-building-block-view.md
  runtime:
    text: >-
      Generation runs during consumer compilation. Strict validation is
      permissive by default and becomes batch-wide when any root enables it;
      diagnostics retain source locations. Corpus and wire evidence is scoped
      to exact RTI profiles and recorded inputs. Wire fixtures compare directed
      exchanges among Wireloom C#, RTI C#, and RTI C++ where qualified.
    sources:
      - docs/architecture/arc42/06-runtime-view.md
  deployment:
    text: >-
      Wireloom.Dds.Generator is the sole published analyzer package. The
      non-packable compiler is bundled beside the adapter at the same version.
      CI checks exact-profile corpus, package and runtime behavior, the minimum
      compiler host, Community Qodana, and Coveralls. The local Playground uses
      a non-packable .NET 10 browser-WASM host in a module worker with a
      TypeScript/Vite client. Quality CI includes strict client checks and
      source-mapped Chromium plus C# adapter coverage. The standalone fuzzing
      project runs without coverage instrumentation.
    sources:
      - docs/architecture/arc42/07-deployment-view.md
  cross_cutting:
    text: >-
      Effective IDL annotations, typed defaults, bounds, and member IDs are
      resolved during binding and shared by output paths. Sequence-array
      mapping defaults to RtiCSharp and may be overridden per declaring file.
      Preprocessing and strictness are batch-wide; mapping is file-owned.
      Deterministic inputs, source mapping, diagnostics, package provenance,
      and exact-profile evidence are cross-cutting requirements. See chapter 8
      and the configuration guide for detailed rules.
    sources:
      - docs/architecture/arc42/08-crosscutting-concepts.md
  decisions:
    text: >-
      ADR-001 (shared compiler), ADR-002 (per-compilation MD5 provider), and
      ADR-003 (browser worker host) are Accepted. ADR-003 was approved by
      Michaël Hompus on 2026-10-26. Chapter 9 is the decision history and
      authoritative status index.
    sources:
      - docs/architecture/arc42/09-architectural-decisions.md
  quality:
    text: >-
      Quality evidence covers exact RTI profiles, corpus and wire behavior,
      package integration, minimum-host loading, maintained C# source, and
      supply-chain controls. Compiler unit coverage is gated at 90% branches
      and 95% lines; fuzzing runs in a separate uninstrumented project.
      Playground checks add strict TypeScript, ESLint, Prettier, direct Node
      coverage at 95% branches and 98% lines, Chromium coverage, and focused
      C# adapter tests. Coveralls combines Playground and adapter Cobertura
      with compiler and generator reports; Community Qodana scans the .NET
      solution. Remote PR Coveralls status is pending until CI reports it.
    sources:
      - docs/architecture/arc42/10-quality-requirements.md
  risks:
    text: >-
      Recursive sequence typedefs remain unsupported; recursive graphs and
      several RTI-specific or optional-type cases remain unqualified. RTI
      7.3.1 C# RPC output for C157/C159 fails compilation (issue 75). Browser
      accessibility, supported-version policy, hosting, and release
      qualification remain in issue 110. Keep adapter and bundled compiler
      versions aligned and preserve direct-caller path and formatting behavior.
    sources:
      - docs/architecture/arc42/11-risks-and-technical-debt.md
  glossary:
    text: >-
      Project-specific terms include Connext IDL, annotation application,
      DdsIdl root, compiler core, Roslyn adapter, compiler profile, RTI oracle,
      wire compatibility, and strict validation. Strict validation is distinct
      from warning promotion, C# escaping, and sequence-array mapping.
    sources:
      - docs/architecture/arc42/12-glossary.md
  browser_playground:
    text: >-
      The desktop-first local Playground runs the shared compiler in a dedicated
      .NET 10 browser-WASM module worker. Versioned requests carry worker,
      request, revision, profile, and file identity; the client accepts only
      current responses and keeps one active plus the newest pending request.
      The host supports collection-shaped virtual files; the current UI uses
      one generation root. Stage 1 provides Monaco editing, examples,
      diagnostics, generated-file browsing, single and ZIP downloads, local
      persistence, resizing, and recovery. Scoped Edge, Firefox, and Playwright
      WebKit checks pass; WebKit does not qualify Safari. Direct Node tests
      cover worker replacement and recovery-save ordering; Chromium coverage
      is mapped to first-party code. ADR-003 is Accepted. Issue 110 tracks
      broader accessibility and release qualification.
    sources:
      - docs/architecture/arc42/04-solution-strategy.md
      - docs/architecture/adr/ADR-003-run-playground-compilation-in-a-browser-worker.md
      - docs/architecture/arc42/05-building-block-view.md
      - docs/architecture/arc42/06-runtime-view.md
      - docs/architecture/arc42/07-deployment-view.md
      - docs/architecture/arc42/08-crosscutting-concepts.md
      - docs/architecture/arc42/10-quality-requirements.md
      - docs/architecture/arc42/11-risks-and-technical-debt.md
      - docs/architecture/dependency-intake/playground-frontend.md

