summary:
  goals:
    text: >-
      Wireloom provides a drop-in RTI C# generation replacement for supported
      IDL and a Modern C++ generator as a product feature. The first C++ release
      targets a stable public contract within an evidence-backed scope;
      release qualification is pending. C++ generation, consumer compatibility,
      CDR, and live DDS remain separate claims.
    sources: [docs/architecture/arc42/01-introduction-and-goals.md, docs/guides/support-and-compatibility.md, src/Wireloom.Dds.Cpp.Generator/README.md]
  constraints:
    text: >-
      C# consumer SDK/runtime requirements do not apply to native C++ generator
      hosts, which need no installed .NET SDK/runtime. Native applications use
      the selected RTI SDK. Generation and report verification need no RTI
      license; live DDS does. Preserve exact-scope evidence and provenance.
      Playground source remains local to the browser.
    sources: [docs/architecture/arc42/02-architecture-constraints.md, docs/guides/support-and-compatibility.md]
  context:
    text: >-
      Wireloom contains the C# and Modern C++ build entry points and the local
      Playground. Consumer applications, RTI runtime, package feeds, and DDS
      traffic remain outside the product boundary.
    sources: [docs/architecture/arc42/03-context-and-scope.md]
  strategy:
    text: >-
      Share preprocessing, binding, and IDL/XTypes semantics through
      Wireloom.Dds.Idl; expose target-neutral declarations and annotations to
      backends while keeping parser, binder, and symbol-table machinery
      internal. Standardize compiler hosts on an immutable request carrying
      input snapshots, MD5 provider, and cancellation, plus a generic result;
      keep profiles and output types backend-specific. Qualify by exact shape
      and RTI profile. Unbounded behavior is opt-in and distinct from finite fallback.
    sources: [docs/architecture/arc42/04-solution-strategy.md, docs/architecture/adr/ADR-004-share-idl-analysis-across-generators.md, docs/architecture/adr/ADR-002-inject-member-id-md5-per-compilation.md]
  building_blocks:
    text: >-
      Wireloom.Dds.Idl exposes the bound model through IdlAnalyzer and shared
      request/result contracts while keeping front-end implementation internal.
      C# and Modern C++ compiler facades own separate profiles, output types,
      projections, and integrations.
      Namespaces follow ownership: Wireloom.Dds.Idl, Wireloom.Dds.CSharp.Compiler,
      Wireloom.Dds.Generator, Wireloom.Dds.Cpp, and Wireloom.Dds.Cpp.Generator;
      the browser host is Wireloom.Playground.Browser.
      The Playground selects C# or C++ per workspace and previews the matching
      MSBuild project or CMake project. Its browser client composes focused
      UI modules for generated-file state and tabs, search, notices, and pane layout
      virtual-file dialogs and mutation workflows are coordinated separately from
      source-tree rendering and navigation.
      while keeping the existing client/worker boundary. Styles are grouped by
      UI responsibility and use native nesting.
      The native C++ NuGet supplies MSBuild and CMake entry points; its supported
      shapes and qualification are recorded in the generator guide and corpus.
    sources: [docs/architecture/arc42/05-building-block-view.md, src/Wireloom.Dds.Idl/Api/IdlCompilationRequest.cs, src/Wireloom.Dds.Idl/Api/IdlCompilationResult.cs, src/Wireloom.Dds.CSharp.Compiler/Api/Compiler.cs, src/Wireloom.Dds.Cpp.Compiler/Api/Compiler.cs, src/Wireloom.Dds.Cpp.Generator/README.md]
  runtime:
    text: >-
      Expected IDL failures return diagnostics; caller/provider faults and
      cancellation propagate. Browser results must match the current workspace
      revision, target, and profile. The v5 worker contract carries target identity.
      C++ value APIs, RTI registration, local CDR, and live peer
      exchange remain separate evidence levels.
    sources: [docs/architecture/arc42/06-runtime-view.md, docs/corpus/7.7.0/FEATURE-COVERAGE.md]
  deployment:
    text: >-
      The C# analyzer package bundles the matching compiler and IDL assemblies.
      Modern C++ ships as host-native AOT NuGet assets for Windows and Linux x64,
      with native MSBuild and CMake integration. Publishers select one revision
      and version for both packages, require native consumer checks on both
      hosts, and publish retained attested bytes. Consumers pin the package
      separately from the RTI profile. Delivery and feature qualification remain
      distinct gates.
      CMake records successful completion separately from emitted text; edits
      with unchanged output settle, while missing outputs and failures retry.
    sources: [docs/architecture/arc42/07-deployment-view.md, docs/architecture/adr/ADR-005-deliver-native-cpp-generator-through-nuget.md]
  cross_cutting:
    text: >-
      Preserve IDL identity, source origins, and declaring-file options.
      Keep optional presence, copy ownership, allocation, and cleanup explicit.
      C++ unions retain always-live branch storage. Module auto-ID follows the
      annotated block in current targets; its standards interpretation remains
      open. Scope annotation state to each compilation. Workspace edits and
      recovery are atomic; target selection is persisted and older workspace
      records migrate to C# mode. Browser storage remains fallible.
    sources: [docs/architecture/arc42/08-crosscutting-concepts.md, docs/guides/cpp-generated-value-semantics.md, docs/guides/idl-semantics.md, docs/guides/playground-workspaces.md]
  decisions:
    text: >-
      ADR-001 through ADR-007 are accepted. The C++ decisions cover shared IDL
      analysis boundaries, native AOT delivery, profile-specific sample-access
      adapters, and staged metadata/plugin initialization. Applying existing
      strategy does not require a new ADR; value mappings and compatibility
      details belong in their guides.
    sources: [docs/architecture/arc42/09-architectural-decisions.md, docs/architecture/adr/ADR-004-share-idl-analysis-across-generators.md, docs/architecture/adr/ADR-005-deliver-native-cpp-generator-through-nuget.md, docs/architecture/adr/ADR-006-use-stl-aware-sample-access-for-modern-cpp.md, docs/architecture/adr/ADR-007-stage-modern-cpp-type-registration.md]
  quality:
    text: >-
      Keep IDL acceptance, generated API shape, package integration, runtime,
      CDR, and live DDS as separate claims. Use case-specific tests and retained
      corpus evidence; unsupported operations fail closed. C++ tests separate
      compiler, corpus, fuzzing, generator package, and generator responsibilities.
      Combined compiler/corpus/generator coverage preserves branch data in one
      collector; fuzzing remains outside coverage. The first stable C++
      release requires exact-package host checks, named native application
      configurations, public-contract regression, and retained capability-level
      evidence before publication.
    sources: [docs/architecture/arc42/10-quality-requirements.md, docs/releases/PREPARING-A-RELEASE.md, docs/testing/quality.md, docs/corpus/7.7.0/FEATURE-COVERAGE.md]
  risks:
    text: >-
      C# compatibility and Modern C++ behavior are RTI-profile-specific. The
      C++ generator depends on RTI-version-sensitive native plugin/interpreter
      interfaces; claims are limited to explicitly qualified shapes. Unsupported
      recursive or nested graphs remain fail-closed or unqualified.
    sources: [docs/architecture/arc42/11-risks-and-technical-debt.md, docs/guides/support-and-compatibility.md, src/Wireloom.Dds.Cpp.Generator/README.md]
  glossary:
    text: >-
      Use chapter 1 role names and chapter 5 block names; chapter 12 defines
      linkable architecture terminology.
    sources: [docs/architecture/arc42/12-glossary.md]
