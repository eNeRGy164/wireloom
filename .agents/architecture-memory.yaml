summary:
  goals:
    text: Keep Connext IDL generation inside the .NET build and advance compatibility through evidence-backed cases.
    sources:
      - docs/architecture/arc42/01-introduction-and-goals.md
  constraints:
    text: The analyzer targets netstandard2.0; consumer applications support .NET 8 and higher with C# 12+, while repository projects default to .NET 10. An explicit RTI runtime reference of at least 7.3.1 is required. The resolved RTI assembly selects the 7.3.1 profile for versions below 7.7.0 and the 7.7.0 profile for 7.7.0 and later. Only exact 7.3.1 and 7.7.0 LTS versions are qualification targets.
    sources:
      - docs/architecture/arc42/02-architecture-constraints.md
  context:
    text: Wireloom is a compile-time component between a consumer project and generated C#; it is not in the DDS data path.
    sources:
      - docs/architecture/arc42/03-context-and-scope.md
  strategy:
    text: Use a managed Roslyn pipeline with explicit roots, project-wide root metadata, independent semantic modeling, and source-located diagnostics. The Roslyn adapter selects one immutable RTI API profile from the resolved assembly version; semantic parsing and validation remain RTI-independent.
    sources:
      - docs/architecture/arc42/04-solution-strategy.md
  building_blocks:
    text: The Roslyn adapter selects an immutable RTI API profile from the resolved assembly version. The input graph and preprocessor feed a target-independent parse-bind-validate front end; compilation orchestration passes validated declarations and the profile to emission planning. Plans own profile- and IDL-shape-specific API, native storage, metadata, and initialization choices. Emitters render plans, and a central result boundary checks duplicate hint names. Generated-value behavior and detailed evidence are maintained in chapter 8.6, the runtime contract matrix, and the corpus feature index.
    sources:
      - docs/architecture/arc42/05-building-block-view.md
  runtime:
    text: Generation occurs during consumer compilation; the manual wire workflow targets exact RTI Connext 7.3.1 and 7.7.0. Whole cases are balanced by exchange count across four isolated shard runners; a report job verifies matching plans and exact coverage, rejecting any not-run exchange before regenerating combined evidence. Each fixture runs across all nine directed pairings of Wireloom C#, RTI-generated C#, and RTI-generated C++. Readers verify fixture payloads while lifecycle notifications are counted separately. Discriminator verification normalizes RTI signed storage to the declared width; character fixtures use typed assignments and independent expected values. Present optional wide-string sequence fixtures use DynamicData and RTI C API setters in the C++ peer; absent, empty, and narrow-only controls use typed peers. Optional aggregate values are included and aggregate DynamicType metadata preserves declared aliases. Recursive array exchanges disable TypeObject/TypeCode propagation and use scoped managed/C++ peer initialization adaptations. C147 applies guarded namespace qualification to RTI C# scratch code and alias-tag TypeCode references to RTI C++ scratch code; all 18 directed exchanges pass on each exact profile while the retained raw RTI C# output records its compilation failure. Full profile wire qualification remains pending. The wchar union uses a manually constructed RTI C++ DynamicType; FlatData uses standard C++ mapping, not RTI's FlatData-specific C++ layout.
    sources:
      - docs/architecture/arc42/06-runtime-view.md
  deployment:
    text: The analyzer is delivered as a NuGet package. Quality CI checks both LTS corpus profiles and eight Windows/Ubuntu, RTI 7.3.1/7.7.0, net8.0/net10.0 runtime and fresh-package combinations. The repository SDK builds all cells; consumers use C# 12. These runtime checks do not qualify older SDK/Roslyn hosts. Manual wire evidence runs both qualified RTI LTS versions as a matrix, with four isolated shards per version (up to eight jobs total) and separate report jobs, summaries, and artifacts. Builds use version-scoped cached images; shard zero per version exports its shared Docker build cache. Each shard receives a runtime-scoped license file; the .NET-only artifact merge jobs have no RTI secret. Add other releases only with a matching toolchain and compatible generator target.
    sources:
      - docs/architecture/arc42/07-deployment-view.md
  cross_cutting:
    text: Corpus oracle reads use the selected LTS capture. Wire planning records unavailable RTI features as notApplicableCases, excluded from exchanges, compatibility failures, and Wireloom implementation gaps. C040 isolates hash IDs on both LTS versions; C142 isolates must-understand, which is N/A on 7.3. Wire evidence must match the exact case inputs and RTI profile. New capture/export evidence retains source identity, input/output hashes, tool versions, arguments, and outcomes; legacy missing provenance stays unknown. The LTS runbook owns reproduction. Evidence vocabulary, deterministic inputs and invalidation, explicit compiler stages, diagnostics, test separation, deterministic preprocessing limits, and supply-chain controls apply across the system. Build-time generated runtime fixtures execute typed managed, native, and support APIs on Windows and Linux, including enum-array defaults and direct and typedef-backed string-sequence union branches. Coveralls measures maintained generator source; generated fixtures and test project code are excluded. The behavior matrix keeps unresolved contracts visible. RTI C# is a baseline, not an API ceiling; improvements supported by RTI C++ evidence require separate wire verification.
    sources:
      - docs/architecture/arc42/08-crosscutting-concepts.md
  decisions:
    text: Roslyn hosting, explicit roots, independent semantic modeling, project-wide root metadata, explicit parse-bind-validate phases, explicit runtime ownership, case-level evidence, separated compiler orchestration/resolution/emission, bounded preprocessing work, manually triggered wire evidence targeting exact RTI 7.3.1 or 7.7.0, preservation of declared alias metadata for optional aggregate members to match RTI, inclusion of warning-only Wireloom-positive cases, and union metadata normalization matching RTI C++ while preserving managed discriminator ranges are current decisions. RTI C# is the managed API baseline, with deliberate improvements allowed and separately evidenced. The wire matrix distinguishes Wireloom C#, RTI C#, and RTI C++ endpoints and exercises all directed pairings; RTI-positive cases rejected by Wireloom remain visible as not implemented.
    sources:
      - docs/architecture/arc42/09-architectural-decisions.md
  quality:
    text: Compatibility shape, diagnostics, package integration, maintainability, incremental build evidence, wire compatibility across Wireloom-positive cases and separate exact 7.3.1 and 7.7.0 three-peer fixture matrices, and supply-chain integrity are the primary quality goals. Continuous Quality CI runs matching-profile corpus checks plus Windows/Ubuntu runtime and fresh-package tests for both LTS packages on net8.0 and net10.0. The runtime contract matrix separately records generated API behavior, compile-blocked inputs, and skipped contracts without establishing wire compatibility. Retained RTI C# oracle sources and typed runtime fixtures cover unbounded typedef behavior. Generated wire reports contain per-fixture and per-pairing outcomes.
    sources:
      - docs/architecture/arc42/10-quality-requirements.md
  risks:
    text: Coverage outside the retained corpus, coarse per-root output invalidation, fixed-limit compatibility, licensed exact-version wire environments, RTI C# binding shape limitation for direct arrays of sequences, optional aggregate wire evidence limited to exact RTI 7.7.0, RTI typed C++ serialization of present optional wide-string sequences (bypassed by a DynamicData C API test-peer workaround), manually maintained C++ DynamicType metadata for the wchar union, RTI 7.3.1 wire qualification, time-sensitive reader match status, high-bit character payload loss in unadapted RTI C# reference bindings, default TypeObject v2 recursive registration, unadapted RTI C# recursive-array singleton and RTI C++ array TypeCode initialization, general mutual recursion and recursive collection typedef runtime behavior, and host qualification remain open risks.
    sources:
      - docs/architecture/arc42/11-risks-and-technical-debt.md
  glossary:
    text: Connext IDL, DdsIdl root, included IDL, type-specific support, RTI oracle, wire compatibility, and wire compatibility matrix have project-specific meanings.
    sources:
      - docs/architecture/arc42/12-glossary.md
