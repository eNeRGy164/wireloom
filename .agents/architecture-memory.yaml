summary:
  goals:
    text: Keep Connext IDL generation inside the .NET build and advance compatibility through evidence-backed cases.
    sources:
      - docs/architecture/arc42/01-introduction-and-goals.md
  constraints:
    text: The analyzer targets netstandard2.0; consumers use .NET 10, C# 12+, and an explicit RTI runtime reference of at least 7.7.0.
    sources:
      - docs/architecture/arc42/02-architecture-constraints.md
  context:
    text: Wireloom is a compile-time component between a consumer project and generated C#; it is not in the DDS data path.
    sources:
      - docs/architecture/arc42/03-context-and-scope.md
  strategy:
    text: Use a managed Roslyn pipeline with explicit roots, independent semantic modeling, and source-located diagnostics.
    sources:
      - docs/architecture/arc42/04-solution-strategy.md
  building_blocks:
    text: Separate input graph, preprocessing, parsing, resolution, emission planning, and output emitters.
    sources:
      - docs/architecture/arc42/05-building-block-view.md
  runtime:
    text: Generation occurs during consumer compilation; the generated application uses its selected RTI runtime afterward.
    sources:
      - docs/architecture/arc42/06-runtime-view.md
  deployment:
    text: The analyzer is delivered as a NuGet package and consumed on developer or CI build hosts.
    sources:
      - docs/architecture/arc42/07-deployment-view.md
  cross_cutting:
    text: Evidence vocabulary, deterministic inputs, diagnostics, test separation, and supply-chain controls apply across the system.
    sources:
      - docs/architecture/arc42/08-crosscutting-concepts.md
  decisions:
    text: Roslyn hosting, explicit roots, independent semantic modeling, explicit runtime ownership, and case-level evidence are current decisions.
    sources:
      - docs/architecture/arc42/09-architectural-decisions.md
  quality:
    text: Compatibility shape, diagnostics, package integration, maintainability, and supply-chain integrity are the primary quality goals.
    sources:
      - docs/architecture/arc42/10-quality-requirements.md
  risks:
    text: Feature coverage, runtime and C++ evidence, host qualification, and cyclic-alias handling remain open risks.
    sources:
      - docs/architecture/arc42/11-risks-and-technical-debt.md
  glossary:
    text: Connext IDL, DdsIdl root, included IDL, type-specific support, RTI oracle, and wire compatibility have project-specific meanings.
    sources:
      - docs/architecture/arc42/12-glossary.md
