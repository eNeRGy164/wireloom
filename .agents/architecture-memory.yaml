summary:
  goals:
    text: >-
      Drop-in RTI C# generation replacement for supported IDL: preserve working
      application APIs and DDS behavior. Normal restore/build needs no external
      generator or machine-specific wiring. Generated C# remains inspectable,
      extensible, outside source control, and free of preventable analysis noise.
      The local Playground is a supporting demo/evaluation tool.
    sources: [docs/architecture/arc42/01-introduction-and-goals.md]
  constraints:
    text: >-
      Honor separate consumer and producer baselines below. Generation and
      report verification need no RTI license secret; live DDS needs the
      selected RTI runtime/license. IDL stays local in the Playground.
      Retain exact-scope evidence/provenance without licenses or credentials.
    sources: [docs/architecture/arc42/02-architecture-constraints.md]
  context:
    text: >-
      One product contains build integration and Playground. Consumers, RTI
      runtime, .NET hosts, feeds, and hosting are external; DDS traffic is
      outside Wireloom. Human roles: .NET DDS application developer, Build and
      CI engineer, Wireloom maintainer, Playground user. RTI support is external.
    sources: [docs/architecture/arc42/03-context-and-scope.md]
  strategy:
    text: >-
      Managed Roslyn incremental adapter plus one host-neutral compiler shared
      with browser callers. OMG IDL/XTypes define meaning; profile-specific
      support is emitted from resolved semantics. Per-call platform services
      include MD5. Unbounded semantics are opt-in and resolved by declaring
      file, separate from finite fallback sizes. Developer-experience improvements may differ observably
      when working application usage and DDS wire behavior are preserved.
    sources: [docs/architecture/arc42/04-solution-strategy.md]
  building_blocks:
    text: >-
      Shared IDL compiler: coordination, input processing, language analysis,
      C# generation. .NET integration: MSBuild and Roslyn adapter. Playground:
      browser client and compilation host. Interfaces/models belong to blocks;
      Runner, Verifier, and Shared qualification tooling are outside the product.
    sources: [docs/architecture/arc42/05-building-block-view.md]
  runtime:
    text: >-
      No roots skips adapter applicability checks. Expected IDL failures return
      diagnostics/no documents; empty success is distinct. Caller/provider faults
      and cancellation propagate. Browser output requires current worker/request/
      revision/profile identity; keep one active and newest unsubmitted request.
      Compilation timeout replaces the worker without replaying in-flight work;
      startup failures/timeouts and uncaught faults require Retry. Per-request
      failure can retain a ready worker.
    sources: [docs/architecture/arc42/06-runtime-view.md]
  deployment:
    text: >-
      One analyzer package bundles matching generator/compiler versions under
      analyzers/dotnet/cs; generated code adds no Wireloom application dependency.
      SDK/IDE selection differs from target framework. Playground uses a complete
      same-origin static bundle and browser workers. Pages promotes validated
      bytes, verifies live HTTPS, and supports manual eligible rollback.
      Changed base paths require matching bundles; changed origins affect storage.
    sources: [docs/architecture/arc42/07-deployment-view.md]
  cross_cutting:
    text: >-
      Preserve typed IDL identity and declaring-file options across outputs;
      roots may share includes and included files may also be roots. Retain
      original UTF-16 origins. Unbounded mode preserves RTI sequence/string
      metadata with zero initial capacity; finite fallback sizes are ignored,
      and explicit IDL bounds remain finite. Isolate snapshots/state; bound work/output, not
      process memory. Distinct macro outputs and unique hints matter. Preserve
      optional presence, reference/copy semantics, allocation, and native cleanup.
      Workspace edits are atomic; source backup is independent of generation.
      Restore cannot overwrite edits; serialize saves/deletes, with no resurrection
      after successful reset deletion. Workspace v3 upgrades to v4 with
      unbounded mode disabled; failed persistence cannot block reading source.
      Browser storage is fallible.
    sources: [docs/architecture/arc42/08-crosscutting-concepts.md, docs/guides/playground-workspaces.md]
  decisions:
    text: >-
      Accepted: ADR-001 shared compiler, ADR-002 per-compilation MD5 delegate,
      ADR-003 browser worker. ADR contexts/measurements are historical snapshots.
      C# wire orchestration reduces maintained languages/scripts. Consult chapter 9
      for evidence-qualified history and rationale; do not invent past approvals.
    sources: [docs/architecture/arc42/09-architectural-decisions.md]
  quality:
    text: >-
      Prioritize compatibility, build integration, generated C#, diagnostics,
      maintainability. Require VS Code/C# tooling and Visual Studio 2026; desktop
      Chrome/Edge/Firefox with keyboard/focus/label/noncolor-error behavior;
      WebKit checks do not qualify Safari.
      Compiler gates: 90% branches/95% lines; Node gates: 98%/99%, distinct from
      broader UI coverage. Profile mapping, corpus, API/runtime, wire, and analysis
      evidence establish different facts. Numerical latency/memory/footprint
      budgets and formal accessibility level remain open; observations are not
      acceptance targets.
    sources: [docs/architecture/arc42/10-quality-requirements.md]
  risks:
    text: >-
      Unbounded wire evidence covers individual samples; fragmentation and
      repeated receive-buffer reuse remain unqualified. Finite fallbacks are
      the default. RTI 7.3.1 C148 enum-array defaults differ across peers.
      Recursive sequence typedefs are rejected; direct self-recursive wire scope
      needs TypeObject v1, while mutual graphs remain unqualified. IDE, consumer
      Qodana/SonarQube and browser/accessibility qualification have gaps; the
      retained report misses the broader UI coverage target. Collected output
      invalidation is batch-wide; optimize on evidence.
      Numerical budgets/post-1.0 policy are open. Reporting guidance and a
      compatibility issue template exist; qualification remains open.
      Priorities constrain affected claims, not all uses.
    sources: [docs/architecture/arc42/11-risks-and-technical-debt.md]
  glossary:
    text: >-
      Use chapter 1 role names and chapter 5 block names; chapter 12 defines
      jargon/aliases with linkable terms. Compiler core means Shared IDL compiler;
      browser workers include separate compiler and editor workers.
    sources: [docs/architecture/arc42/12-glossary.md]
