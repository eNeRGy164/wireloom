summary:
  goals:
    text: Minimize generation footprint and developer-machine setup, replace environment-variable/MSBuild wiring with declarative repeatable builds, and produce C# suited to strict compiler and analyzer policies. The original pipeline gained about 2 GB of Docker image tooling and substantial generated-source analyzer noise. Keep Connext IDL generation inside the .NET build and grow compatibility through evidence-backed cases.
    sources:
      - docs/architecture/arc42/01-introduction-and-goals.md
  constraints:
    text: The analyzer targets netstandard2.0; consumers need .NET 8+ and C# 12+. RTI runtime 7.3.1+ is a package-reference floor, but only exact RTI 7.7.0 is qualified. Oracles use RTI 7.7.0 / rtiddsgen 4.7.0.
    sources:
      - docs/architecture/arc42/02-architecture-constraints.md
  context:
    text: Wireloom is an independent compile-time generator integrated through Roslyn/MSBuild. Best-effort scope covers generated code, samples, plugins, and build/IDE integration; RTI owns runtime, licensing, DDS operation, and support. No official RTI relationship.
    sources:
      - docs/architecture/arc42/03-context-and-scope.md
  strategy:
    text: Use explicit DdsIdl roots and project-wide metadata, then resolve/preprocess, parse, bind, validate, plan, and emit managed C# through a managed Roslyn pipeline. Input that prevents safe managed output fails with source-located diagnostics; deliberately ignored constructs and potentially lossy mappings report diagnostics while generation continues.
    sources:
      - docs/architecture/arc42/04-solution-strategy.md
  building_blocks:
    text: Keep Roslyn hosting, preprocessing/input graph, target-independent parse-bind-validate, emission planning, and writers as separate stages. Preserve managed API, native conversion, and DynamicType contracts for aliases, optional presence, bounded collections, and union discriminators. Collection element aliases follow RTI C# target-kind mapping: primitive/string aliases erase, enum and aggregate aliases use their underlying type, and sequence/array aliases remain named when nested; declared scalar aliases can remain in struct-member DynamicType metadata while managed sequence properties use the underlying primitive.
    sources:
      - docs/architecture/arc42/05-building-block-view.md
  runtime:
    text: Consumer compilation performs generation. Manual wire evidence targets RTI 7.7.0 across nine directed pairings of Wireloom C#, RTI C#, and RTI C++; passes require valid payload comparison. Array-of-sequences has known expected Wireloom C# failures. Some RTI 7.7.0 cases require peer/QoS adaptations; these do not establish unadapted interoperability. See the wire runbook.
    sources:
      - docs/architecture/arc42/06-runtime-view.md
  deployment:
    text: Deliver the analyzer as a NuGet package; consumers deploy with their selected RTI runtime. Wire peer execution uses licensed RTI 7.7.0 jobs, while report assembly runs without the RTI secret. Version expansion needs a matching toolchain and compatible generator target.
    sources:
      - docs/architecture/arc42/07-deployment-view.md
  cross_cutting:
    text: "Keep evidence categories distinct: required types/properties/enum-member checks, runtime contracts, serialization, and DDS wire interoperability. Shape checks do not establish identical public APIs. Reject unsafe input; use explicit diagnostics for limited or lossy constructs. Coveralls measures maintained generator source, not generated fixtures or test code."
    sources:
      - docs/architecture/arc42/08-crosscutting-concepts.md
  decisions:
    text: Match RTI C# unless a reproducible RTI C# defect justifies a documented correction; RTI C++ wire behavior alone does not justify a different managed API shape. Wire qualification targets all nine directed pairings of Wireloom C#, RTI C#, and RTI C++ for selected fixtures on exact RTI 7.7.0. Keep RTI-positive cases rejected by Wireloom visible as unimplemented.
    sources:
      - docs/architecture/arc42/09-architectural-decisions.md
  quality:
    text: Track generated shape, generated C# compiler/analyzer quality, repeatable package-based setup, diagnostics, maintainability, incremental behavior, supply chain, and version-qualified wire compatibility. Runtime contract tests establish generated API behavior, not wire compatibility; wire reports record per-fixture and per-pairing outcomes.
    sources:
      - docs/architecture/arc42/10-quality-requirements.md
  risks:
    text: Unqualified areas include RTI 7.3.1 and host/IDE combinations, corpus-external IDL, array-of-sequences shape/interoperability, and unadapted recursive/optional wire scenarios. See chapter 11 and the support policy.
    sources:
      - docs/architecture/arc42/11-risks-and-technical-debt.md
  glossary:
    text: The glossary defines Connext IDL and generation roots, DDS-XTypes and XCDR2, TypeObject/TypeCode metadata, DynamicType/DynamicData, extensibility and optional presence, plus repository tools Qodana and WSL Containers.
    sources:
      - docs/architecture/arc42/12-glossary.md
