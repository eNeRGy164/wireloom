summary:
  goals:
    text: Keep Connext IDL generation inside the .NET build and advance compatibility through evidence-backed cases.
    sources:
      - docs/architecture/arc42/01-introduction-and-goals.md
  constraints:
    text: The analyzer targets netstandard2.0; consumers use .NET 10, C# 12+, and an explicit RTI runtime reference of at least 7.3.1. Retained oracle sources use RTI 7.7.0 / rtiddsgen 4.7.0.
    sources:
      - docs/architecture/arc42/02-architecture-constraints.md
  context:
    text: Wireloom is a compile-time component between a consumer project and generated C#; it is not in the DDS data path.
    sources:
      - docs/architecture/arc42/03-context-and-scope.md
  strategy:
    text: Use a managed Roslyn pipeline with explicit roots, project-wide root metadata, independent semantic modeling, and source-located diagnostics.
    sources:
      - docs/architecture/arc42/04-solution-strategy.md
  building_blocks:
    text: Separate Roslyn hosting, input graph and preprocessing, explicit parse-bind-validate front-end phases, compilation orchestration and resolution, emission models and plans, and output emitters. Aggregate members declared through struct or union typedef chains use the underlying aggregate type in generated member APIs and native conversions while standalone typedef declarations remain generated.
    sources:
      - docs/architecture/arc42/05-building-block-view.md
  runtime:
    text: Generation occurs during consumer compilation; the manual wire workflow covers Wireloom-positive, wire-testable cases on exact RTI 7.7.0. The expanded fixture catalog ran 372 scenarios with 364 passing and 8 failing. Remaining failures cover array-of-sequences cross-language discovery and present optional wide-string sequences. Aggregate alias members project to their underlying struct or union type; all four nested-alias aggregate pairings and all eight union-alias branch pairings pass. The RTI-positive optional-aggregate case is excluded because Wireloom reports DDSG0001. Each fixture runs as an independent exchange across C#→C#, C++→C++, C#→C++, and C++→C#; consumers compare the expected sample. Markdown summarizes status and defects while JSON and sanitized logs retain scenario metadata. Both peers request reliable delivery, and representation cases select XCDR2. The wchar union uses an RTI C++ DynamicType because rtiddsgen cannot parse it. The FlatData case uses standard C++ peer generation after removing its C#-ignored annotation; this does not validate RTI's FlatData-specific C++ layout. RTI 7.3.1 needs future target-version-aware emission.
    sources:
      - docs/architecture/arc42/06-runtime-view.md
  deployment:
    text: The analyzer is delivered as a NuGet package; initial manual wire evidence requires exact RTI 7.7.0 tooling and a runtime-scoped license file. Add other releases only with a matching toolchain and compatible generator target.
    sources:
      - docs/architecture/arc42/07-deployment-view.md
  cross_cutting:
    text: Evidence vocabulary, deterministic inputs and invalidation, explicit compiler stages, diagnostics, test separation, deterministic preprocessing limits, and supply-chain controls apply across the system.
    sources:
      - docs/architecture/arc42/08-crosscutting-concepts.md
  decisions:
    text: Roslyn hosting, explicit roots, independent semantic modeling, project-wide root metadata, explicit parse-bind-validate phases, explicit runtime ownership, case-level evidence, separated compiler orchestration/resolution/emission, bounded preprocessing work, manually triggered wire evidence, exact 7.7.0 as the initial wire baseline, and inclusion of warning-only Wireloom-positive cases are current decisions; RTI-positive cases rejected by Wireloom remain excluded.
    sources:
      - docs/architecture/arc42/09-architectural-decisions.md
  quality:
    text: Compatibility shape, diagnostics, package integration, maintainability, incremental build evidence, wire compatibility across Wireloom-positive cases and the expanded exact 7.7.0 fixture matrix, and supply-chain integrity are the primary quality goals. The current matrix snapshot completed 372 scenarios with 364 passing and 8 failures; the failures cover array-of-sequences cross-language discovery and present optional wide-string sequences.
    sources:
      - docs/architecture/arc42/10-quality-requirements.md
  risks:
    text: Coverage outside the retained corpus, coarse per-root output invalidation, fixed-limit compatibility, licensed exact-version wire environments, RTI C# binding shape limitation for direct arrays of sequences, unsupported optional aggregate members (DDSG0001), present optional wide-string sequence interoperability, manually maintained C++ DynamicType metadata for the wchar union, RTI 7.3.1 target compatibility, time-sensitive reader match status, and host qualification remain open risks.
    sources:
      - docs/architecture/arc42/11-risks-and-technical-debt.md
  glossary:
    text: Connext IDL, DdsIdl root, included IDL, type-specific support, RTI oracle, wire compatibility, and wire compatibility matrix have project-specific meanings.
    sources:
      - docs/architecture/arc42/12-glossary.md
