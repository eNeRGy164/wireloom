summary:
  goals:
    text: Keep Connext IDL generation inside the .NET build and advance compatibility through evidence-backed cases.
    sources:
      - docs/architecture/arc42/01-introduction-and-goals.md
  constraints:
    text: The analyzer targets netstandard2.0 and references Roslyn 4.8.0, so it loads in the first .NET 8 C# 12 SDK host. Consumer applications support .NET 8 and higher with C# 12+, while repository projects default to .NET 10. An explicit RTI runtime reference of at least 7.3.1 is required. The resolved RTI assembly selects the 7.3.1 profile for versions below 7.7.0 and the 7.7.0 profile for 7.7.0 and later. Only exact 7.3.1 and 7.7.0 LTS versions are qualification targets.
    sources:
      - docs/architecture/arc42/02-architecture-constraints.md
  context:
    text: Wireloom is a compile-time component between a consumer project and generated C#; it is not in the DDS data path.
    sources:
      - docs/architecture/arc42/03-context-and-scope.md
  strategy:
    text: OMG IDL and DDS-XTypes define supported language semantics; RTI captures establish tested compatibility rather than a language ceiling. Use a managed Roslyn pipeline with explicit roots, batch-wide preprocessing/strictness metadata, file-owned sequence-array mapping, independent semantic modeling, and source-located diagnostics. The Roslyn adapter selects one immutable RTI API profile from the resolved assembly version; semantic parsing and validation remain RTI-independent.
    sources:
      - docs/architecture/arc42/04-solution-strategy.md
  building_blocks:
    text: IdlScalarValue gives constants and defaults mutually exclusive integer, boolean, character, floating-point, string, and enumeration variants, preserving width and enum identity. Integer expressions consume only integer values. IdlTypeAnnotationPrefix buffers unknown applications between type-prefix annotations and reports them only after a matching declaration parser accepts the target. IdlValueBinder owns queued constant, typedef, and member value binding; IdlValueResolver applies typed default, boolean member-flag, and range rules. Member boolean annotation constants bind after discrete constants, including forward and scoped references. Parsing captures annotation syntax and original offsets without speculative evaluation. IdlStringLiteralDecoder decodes tokens before concatenating values and checking final bounds. ScalarValueEmissionPlan supplies shared managed/native defaults and annotation values, and union branches share one copy operation. The Roslyn adapter selects an immutable RTI API profile from the resolved assembly version. The input graph and preprocessor feed a target-independent parse-bind-validate front end; compilation orchestration passes validated declarations and the profile to emission planning. Plans own profile- and IDL-shape-specific API, native storage, metadata, and initialization choices. SequenceArrayEmissionPlan reserves deterministic wrappers for opt-in Idl direct sequence arrays on class fields and union branches without mutating the semantic model; inherited class fields share the projection and enclosing metadata contains anonymous sequences. Emitters render plans, and a central result boundary checks duplicate hint names. Generated-value behavior and detailed evidence are maintained in chapter 8.6, the runtime contract matrix, and the corpus feature index. Parsers capture source-mapped identifier facts; pure identifier rules and derived-key detection produce typed findings. A separate validation policy owns ignore/warn/fail decisions; Roslyn owns diagnostic presentation. Emission and RTI profiles have no strictness dependency. IdlInterfaceIdentifierParser tokenizes body declarations and captures their service/operation scope facts without creating emission types. IdlSyntaxReader captures ordered balanced annotation applications and source offsets; IdlAnnotationCatalog defines known and recognized-unsupported names, parameter kinds/defaults, targets, positional rules, repeat/conflict metadata, and support status while leaving unknown arguments opaque. Readers consume ordered raw applications with mapped source spans; public composition tests assert generated API/metadata and diagnostics across targets. Semantic models retain effective values and unresolved expressions, while comma-separated members continue applying effective metadata only to the final declarator for compatibility. Catalog repeat/conflict validation covers declaration prefixes, members, enum literals, and union branches. Local struct/union @autoid and typedef @default applications are retained on semantic targets; typedef expressions are evaluated during binding after target type resolution. Module scope declarations retain module-level annotations and resolve the member-ID policy inherited by nested declarations because member IDs are assigned during declaration parsing. Typed expression dispatch reuses integral and floating evaluators with OMG numeric semantics; boolean, character, string, and enum values bind as typed literals or names. Integer parsing supports decimal, octal, and hexadecimal literals plus OMG numeric operators and shift limits. Referenced integral constants preserve declared rank during expression promotion, including aliases. Long double and fixed-point remain unsupported; the internal scalar model is extensible. Shared syntax reading preserves quoted delimiters; binding resolves chained constants, enum identity, member IDs, bounds, labels, and typed defaults against the symbol graph. Emission plans carry effective defaults; default aggregate union-array branches initialize and deep-copy each element.
    sources:
      - docs/architecture/arc42/05-building-block-view.md
  runtime:
    text: Generation occurs during consumer compilation; the manual wire workflow targets exact RTI Connext 7.3.1 and 7.7.0. Whole cases are balanced by exchange count across eight isolated shard runners per profile; a report job verifies matching plans and exact coverage, rejecting any not-run exchange before regenerating combined evidence. Each fixture runs across all nine directed pairings of Wireloom C#, RTI-generated C#, and RTI-generated C++. Readers verify fixture payloads while lifecycle notifications are counted separately. Discriminator verification normalizes RTI signed storage to the declared width; character fixtures use typed assignments and independent expected values. Present optional wide-string sequence fixtures use DynamicData and RTI C API setters in the C++ peer; absent, empty, and narrow-only controls use typed peers. Optional aggregate values are included and aggregate DynamicType metadata preserves declared aliases. Recursive array exchanges disable TypeObject/TypeCode propagation and use scoped managed/C++ peer initialization adaptations. C147 applies guarded namespace qualification to RTI C# scratch code and alias-tag TypeCode references to RTI C++ scratch code; all 18 directed exchanges pass on each exact profile while the retained raw RTI C# output records its compilation failure. Full profile wire qualification remains pending. The wchar union uses a manually constructed RTI C++ DynamicType; FlatData uses standard C++ mapping, not RTI's FlatData-specific C++ layout. Strict naming violations fail the complete batch before emission; permissive naming findings report DDSG0108 and continue. Any generating root enables strictness for all reachable inputs.
    sources:
      - docs/architecture/arc42/06-runtime-view.md
  deployment:
    text: The analyzer is delivered as a NuGet package. Quality CI checks both LTS corpus profiles and eight Windows/Ubuntu, RTI 7.3.1/7.7.0, net8.0/net10.0 runtime and fresh-package combinations. Separate Ubuntu SDK 8.0.100 container jobs restore, compile, and run the freshly packed consumer without a .NET 10 installation, qualifying the minimum C# 12 Roslyn host against both LTS packages. Manual wire evidence runs both qualified RTI LTS versions as a matrix, with eight isolated shards per version (up to 16 jobs total) and separate report jobs, summaries, and artifacts. The trimmed .NET/RTI native image uses checked-in C++ peers and no Java or rtiddsgen. Builds use version-scoped cached images; shard zero per version exports its shared Docker build cache. Ccache uses stable OS, RTI, compiler, shard, and source-input keys with compatible restore prefixes; GitHub branch cache scope remains in force. Each shard receives a runtime-scoped license file; the .NET-only artifact merge jobs have no RTI secret. Add other releases only with a matching toolchain and compatible generator target.
    sources:
      - docs/architecture/arc42/07-deployment-view.md
  cross_cutting:
    text: FINAL and APPENDABLE enums accept shorthand and full-form annotations; MUTABLE enums are invalid under DDS-XTypes. Every wide-string literal token requires the L prefix. Range validation compares boolean and character defaults using their ordering representation without admitting those values into integer expressions. Native conversion initializes aggregate elements when activating union array branches. Legacy unprefixed wchar union literals remain an explicit Wireloom extension. Corpus oracle reads use the selected LTS capture. Generated RTI reference sources are retained with original notices and provenance and are not relicensed under the repository MIT License. Wire planning records unavailable RTI features as notApplicableCases, excluded from exchanges, compatibility failures, and Wireloom implementation gaps. C040 isolates hash IDs on both LTS versions; C142 isolates must-understand, which is N/A on 7.3. Wire evidence must match the exact case inputs and RTI profile. New capture/export evidence retains source identity, input/output hashes, tool versions, arguments, and outcomes; legacy missing provenance stays unknown. The LTS runbook owns reproduction. Annotation applications distinguish absence from explicit false; bare auto-ID means HASH, module policy is scoped to its block, and local settings do not leak to siblings or included top-level declarations. A member default overrides the nearest annotated typedef, with the effective typed value shared by managed/native initialization and DynamicType metadata. Enum constants and their aliases retain identity; shared evaluation handles symbolic and scoped union labels and detects evaluated duplicates. Explicit member-ID expressions resolve after constants and before duplicate-ID validation, overriding automatic hash IDs. Effective IDs continue after explicit or sequential IDs across inheritance; hash IDs do not advance the sequential counter. Validation checks inherited and local IDs together, and emission renders the bound IDs. C163-C172 record generation evidence for these features, with RTI C# and C++ reference sources retained with original notices and Wireloom C# compiled against each profile. Sixteen typed fixtures cover directed exchanges among Wireloom C#, RTI C#, and RTI C++ on both profiles. C164/C172 use topic wrappers around unchanged canonical IDL; RTI 7.3.1 C# generation stages byte-identical include files. C171 defaults are inherited=7, overridden=9, text="alias", ratio=1.5, and single=1.25; a compatible sparse appendable writer causes the reader to apply defaults to omitted trailing members on RTI 7.7.0. RTI 7.3.1 lacks the member-annotation API used for that metadata path. Runtime contracts check fractional and non-ASCII wide-string initialization on both LTS profiles and exact annotation metadata on 7.7.0. RTI 7.7.0 DynamicData clear restoration truncates fractional defaults and returns ?? for a non-ASCII wide-string default; cleared integral, narrow-string, and signed-zero defaults are covered separately. Evidence vocabulary, deterministic inputs and invalidation, explicit compiler stages, diagnostics, test separation, deterministic preprocessing limits, and supply-chain controls apply across the system. Build-time generated runtime fixtures execute typed managed, native, and support APIs on Windows and Linux, including enum-array defaults, default aggregate-array union initialization and copying, and direct and typedef-backed string-sequence union branches. The packed-package suite links the runtime contracts and runs against the package assets, including the SDK 8 compiler host. Coveralls measures maintained generator source; generated fixtures and test project code are excluded. The behavior matrix keeps unresolved contracts visible. RTI C# is a baseline, not an API ceiling; improvements supported by RTI C++ evidence require separate wire verification. Direct sequence arrays default to RtiCSharp flattening; DdsIdlSequenceArrayMapping sets a project default and SequenceArrayMapping overrides it per declaring file, including tracked includes. Idl mode has typed runtime tests on both LTS profiles; direct sequence-array union branches share the configured mapping. Invalid modes and recursive direct arrays are rejected before emission, and dedicated C149 passes all 16 focused Wireloom/C++ DDS exchanges per exact profile. Strict defaults to false and applies batch-wide when any generating root enables it. Naming violations warn with DDSG0108 by default and fail before emission in strict mode; exact reserved keywords fail in every interface body. Ordinary interface bodies retain RTI acceptance for specification-only names; DDS-service bodies apply naming policy to operations, parameters, attributes, and nested declarations. Operation parameters have independent scopes. Body types are not emitted or bound, and constructed-type nesting is limited to 64. The configuration reference owns detailed scope rules and RTI differences. Binding and generated names remain unchanged.
    sources:
      - docs/architecture/arc42/08-crosscutting-concepts.md
  decisions:
    text: Roslyn hosting at the minimum .NET 8 C# 12 host, explicit roots, independent semantic modeling, project-wide root metadata, explicit parse-bind-validate phases, explicit runtime ownership, case-level evidence, separated compiler orchestration/resolution/emission, bounded preprocessing work, manually triggered wire evidence targeting exact RTI 7.3.1 or 7.7.0, preservation of declared alias metadata for optional aggregate members to match RTI, inclusion of warning-only Wireloom-positive cases, and union metadata normalization matching RTI C++ while preserving managed discriminator ranges are current decisions. RTI C# is the managed API baseline, with deliberate improvements allowed and separately evidenced. The wire matrix distinguishes Wireloom C#, RTI C#, and RTI C++ endpoints and exercises all directed pairings for ordinary cases; C149 records an explicit mode, peer scope, exclusion reasons, and matching source provenance as an ordinary corpus case; RTI-positive cases rejected by Wireloom remain visible as not implemented. Specification detection is separate from validation policy; case-insensitive collision detection does not normalize names or change binding.
    sources:
      - docs/architecture/arc42/09-architectural-decisions.md
  quality:
    text: Compatibility shape, diagnostics, package integration, maintainability, incremental build evidence, wire compatibility across Wireloom-positive cases and separate exact 7.3.1 and 7.7.0 three-peer fixture matrices, and supply-chain integrity are the primary quality goals. Continuous Quality CI runs matching-profile corpus checks plus Windows/Ubuntu runtime and fresh-package tests for both LTS packages on net8.0 and net10.0, and a .NET 8.0.100-only container runs the broad packed consumer suite for each LTS package. The runtime contract matrix separately records generated API behavior, compile-blocked inputs, and skipped contracts without establishing wire compatibility. Retained RTI C# oracle sources and typed runtime fixtures cover unbounded typedef behavior. Generated wire reports contain per-fixture and per-pairing outcomes. C149 is a dedicated Idl case with retained profile-specific sources and hashes; RTI C# is explicitly excluded because its direct-form binding flattens this type. Completed evidence without matching mode/runtime/input/generated-source provenance is rejected. C150-C162 retain paired default/strict inputs and actual C#/C++ RTI captures on both profiles. C163-C172 add ten exact-profile annotation, declarator, union, expression-bound, enum-constant, and typed-default cases; RTI C# and C++ sources and capture hashes are retained, and Wireloom C# outputs compile against each profile. Sixteen typed fixtures cover directed exchanges among Wireloom C#, RTI C#, and RTI C++ on both LTS versions. C171's default and explicit-value fixtures cover both profiles; its focused omitted-field exchange runs on 7.7.0. Runtime contracts verify typed initialization on both profiles and record RTI 7.7.0 fractional/wide-string DynamicData clear limitations alongside supported clear defaults. Unit and packed-consumer checks verify warning versus no-output error behavior, including the minimum SDK 8 host.
    sources:
      - docs/architecture/arc42/10-quality-requirements.md
  risks:
    text: Coverage outside the retained corpus remains unverified, alongside coverage outside the retained corpus, coarse per-root output invalidation, fixed-limit compatibility, licensed exact-version wire environments, RTI C# binding shape limitation for direct arrays of sequences, RTI typed C++ serialization of present optional wide-string sequences (bypassed by a DynamicData C API test-peer workaround), manually maintained C++ DynamicType metadata for the wchar union, RTI 7.3.1 wire qualification, default TypeObject v2 recursive registration, unadapted RTI C# recursive-array singleton and RTI C++ array TypeCode initialization, general mutual recursion and recursive collection typedef runtime behavior, and interactive IDE qualification remain open risks. DDSG0108 may become an error under consumer warnings-as-errors policies. Previously tolerated exact reserved keywords now fail in both modes. Strict validation does not claim complete rtiddsgen parity; separate-enum literals use the stricter enclosing IDL scope. RTI 7.3.1 emits invalid C# RPC transport output for service cases C157/C159; the raw sources and failed compilation outcomes are retained, with follow-up in issue 75.
    sources:
      - docs/architecture/arc42/11-risks-and-technical-debt.md
  glossary:
    text: Connext IDL, annotation application, constant expression, DdsIdl root, included IDL, type-specific support, RTI oracle, wire compatibility, wire compatibility matrix, and Docker Desktop container workflows have project-specific meanings. Strict validation is the batch-wide semantic naming and derived-key policy; it is separate from warning promotion, C# escaping, and sequence-array mapping.
    sources:
      - docs/architecture/arc42/12-glossary.md
