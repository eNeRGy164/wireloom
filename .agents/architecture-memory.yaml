summary:
  goals:
    text: Keep Connext IDL generation inside the .NET build and advance compatibility through evidence-backed cases.
    sources:
      - docs/architecture/arc42/01-introduction-and-goals.md
  constraints:
    text: The analyzer targets netstandard2.0; consumers use .NET 10, C# 12+, and an explicit RTI runtime reference of at least 7.3.1. Retained oracle sources use RTI 7.7.0 / rtiddsgen 4.7.0.
    sources:
      - docs/architecture/arc42/02-architecture-constraints.md
  context:
    text: Wireloom is a compile-time component between a consumer project and generated C#; it is not in the DDS data path.
    sources:
      - docs/architecture/arc42/03-context-and-scope.md
  strategy:
    text: Use a managed Roslyn pipeline with explicit roots, project-wide root metadata, independent semantic modeling, and source-located diagnostics.
    sources:
      - docs/architecture/arc42/04-solution-strategy.md
  building_blocks:
    text: Separate Roslyn hosting, input graph and preprocessing, explicit parse-bind-validate front-end phases, compilation orchestration and resolution, emission models and plans, and output emitters. Aggregate members and raw array or sequence elements declared through struct or union typedef chains use the underlying aggregate type in generated APIs and native conversions while standalone typedef declarations remain generated. Optional struct members whose value is a struct or union preserve null presence through NativeManagedOptional conversions and optional DynamicType metadata. For those optional members, DynamicType retains declared alias support to match RTI while managed APIs and native conversions use the underlying aggregate; optional union branches follow RTI's required selected-branch shape.
    sources:
      - docs/architecture/arc42/05-building-block-view.md
  runtime:
    text: Generation occurs during consumer compilation; the manual wire workflow covers Wireloom-positive, wire-testable cases on exact RTI 7.7.0. Each fixture runs across all nine directed pairings of Wireloom C#, RTI-generated C#, and RTI-generated C++; JSON and Markdown distinguish endpoints by implementation and language. RTI C# is generated from the same IDL with the pinned code generator and compiled from scratch output per case. Readers verify fixture values and sample validity. For present optional wide-string sequence fixtures, the C++ peer uses DynamicData and RTI C API setters to avoid a crash in RTI's typed std::wstring sequence serializer; absent, empty, and narrow-only controls remain typed. Current scenario totals come from generated results. Optional aggregate struct and union values generate successfully, but their new wire exchanges await an exact RTI 7.7.0 run. Aggregate aliases use underlying types in managed APIs while optional aggregate DynamicType metadata preserves declared typedef aliases. The wchar union uses an RTI C++ DynamicType because rtiddsgen cannot parse it. The FlatData case uses standard C++ peer generation after removing its C#-ignored annotation; this does not validate RTI's FlatData-specific C++ layout. RTI 7.3.1 needs future target-version-aware emission.
    sources:
      - docs/architecture/arc42/06-runtime-view.md
  deployment:
    text: The analyzer is delivered as a NuGet package; initial manual wire evidence requires exact RTI 7.7.0 tooling and a runtime-scoped license file. Add other releases only with a matching toolchain and compatible generator target.
    sources:
      - docs/architecture/arc42/07-deployment-view.md
  cross_cutting:
    text: Evidence vocabulary, deterministic inputs and invalidation, explicit compiler stages, diagnostics, test separation, deterministic preprocessing limits, and supply-chain controls apply across the system.
    sources:
      - docs/architecture/arc42/08-crosscutting-concepts.md
  decisions:
    text: Roslyn hosting, explicit roots, independent semantic modeling, project-wide root metadata, explicit parse-bind-validate phases, explicit runtime ownership, case-level evidence, separated compiler orchestration/resolution/emission, bounded preprocessing work, manually triggered wire evidence, exact 7.7.0 as the initial wire baseline, preservation of declared alias metadata for optional aggregate members to match RTI, and inclusion of warning-only Wireloom-positive cases are current decisions. The wire matrix distinguishes Wireloom C#, RTI C#, and RTI C++ endpoints and exercises all directed pairings; RTI-positive cases rejected by Wireloom remain visible as not implemented.
    sources:
      - docs/architecture/arc42/09-architectural-decisions.md
  quality:
    text: Compatibility shape, diagnostics, package integration, maintainability, incremental build evidence, wire compatibility across Wireloom-positive cases and the expanded exact 7.7.0 three-peer fixture matrix, and supply-chain integrity are the primary quality goals. Current matrix totals are reported in the generated result artifact; optional aggregate exchanges await an exact licensed run.
    sources:
      - docs/architecture/arc42/10-quality-requirements.md
  risks:
    text: Coverage outside the retained corpus, coarse per-root output invalidation, fixed-limit compatibility, licensed exact-version wire environments, RTI C# binding shape limitation for direct arrays of sequences, optional aggregate wire evidence pending exact RTI 7.7.0 execution, RTI typed C++ serialization of present optional wide-string sequences (bypassed by a DynamicData C API test-peer workaround), manually maintained C++ DynamicType metadata for the wchar union, RTI 7.3.1 target compatibility, time-sensitive reader match status, and host qualification remain open risks.
    sources:
      - docs/architecture/arc42/11-risks-and-technical-debt.md
  glossary:
    text: Connext IDL, DdsIdl root, included IDL, type-specific support, RTI oracle, wire compatibility, and wire compatibility matrix have project-specific meanings.
    sources:
      - docs/architecture/arc42/12-glossary.md
