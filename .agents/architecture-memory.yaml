summary:
  goals:
    text: Keep Connext IDL generation inside the .NET build and advance compatibility through evidence-backed cases.
    sources:
      - docs/architecture/arc42/01-introduction-and-goals.md
  constraints:
    text: The analyzer targets netstandard2.0; consumer applications support .NET 8 and higher with C# 12+, while repository projects default to .NET 10. An explicit RTI runtime reference of at least 7.3.1 is required. Retained oracle sources use RTI 7.7.0 / rtiddsgen 4.7.0.
    sources:
      - docs/architecture/arc42/02-architecture-constraints.md
  context:
    text: Wireloom is a compile-time component between a consumer project and generated C#; it is not in the DDS data path.
    sources:
      - docs/architecture/arc42/03-context-and-scope.md
  strategy:
    text: Use a managed Roslyn pipeline with explicit roots, project-wide root metadata, independent semantic modeling, and source-located diagnostics.
    sources:
      - docs/architecture/arc42/04-solution-strategy.md
  building_blocks:
    text: Separate Roslyn hosting, input graph and preprocessing, explicit parse-bind-validate front-end phases, compilation orchestration and resolution, emission models and plans, and output emitters. Aggregate members and raw array or sequence elements declared through struct or union typedef chains use the underlying aggregate type in generated APIs and native conversions while standalone typedef declarations remain generated. Optional struct members whose value is a struct or union preserve null presence through NativeManagedOptional conversions and optional DynamicType metadata. For those optional members, DynamicType retains declared alias support to match RTI while managed APIs and native conversions use the underlying aggregate; optional union branches follow RTI's required selected-branch shape. Union metadata uses signed 8-bit narrow-character labels matching correctly compiled RTI C++ (logical 254 uses metadata label -2) and signed full-width unsigned labels while preserving managed discriminator ranges. Narrow char labels and default selection are restricted to 0..255, including literals and typedefs; wchar retains 0..65535.
    sources:
      - docs/architecture/arc42/05-building-block-view.md
  runtime:
    text: Generation occurs during consumer compilation; the manual wire workflow targets RTI Connext 7.7.0. Each fixture runs across all nine directed pairings of Wireloom C#, RTI-generated C#, and RTI-generated C++. Readers require and verify valid fixture payloads while counting ordinary instance lifecycle notifications separately. Discriminator verification normalizes RTI signed storage to the declared width; character fixtures use typed assignments and independent expected values. The character-boundary C++ peer uses a single-byte execution charset to preserve byte 255 and signed label -1. Present optional wide-string sequence fixtures use DynamicData and RTI C API setters in the C++ peer; absent, empty, and narrow-only controls use typed peers. Optional aggregate values are supported by the generator, but their interoperability is unverified until a licensed matrix result is available. Aggregate DynamicType metadata preserves declared aliases. RTI 7.3.1 generated-code compatibility is not established. The wchar union uses a manually constructed RTI C++ DynamicType; FlatData uses standard C++ mapping, not RTI's FlatData-specific C++ layout.
    sources:
      - docs/architecture/arc42/06-runtime-view.md
  deployment:
    text: The analyzer is delivered as a NuGet package; initial manual wire evidence requires exact RTI 7.7.0 tooling and a runtime-scoped license file. Add other releases only with a matching toolchain and compatible generator target.
    sources:
      - docs/architecture/arc42/07-deployment-view.md
  cross_cutting:
    text: Evidence vocabulary, deterministic inputs and invalidation, explicit compiler stages, diagnostics, test separation, deterministic preprocessing limits, and supply-chain controls apply across the system.
    sources:
      - docs/architecture/arc42/08-crosscutting-concepts.md
  decisions:
    text: Roslyn hosting, explicit roots, independent semantic modeling, project-wide root metadata, explicit parse-bind-validate phases, explicit runtime ownership, case-level evidence, separated compiler orchestration/resolution/emission, bounded preprocessing work, manually triggered wire evidence targeting exact RTI 7.7.0, preservation of declared alias metadata for optional aggregate members to match RTI, inclusion of warning-only Wireloom-positive cases, and union metadata normalization matching RTI C++ while preserving managed discriminator ranges are current decisions. The wire matrix distinguishes Wireloom C#, RTI C#, and RTI C++ endpoints and exercises all directed pairings; RTI-positive cases rejected by Wireloom remain visible as not implemented.
    sources:
      - docs/architecture/arc42/09-architectural-decisions.md
  quality:
    text: Compatibility shape, diagnostics, package integration, maintainability, incremental build evidence, wire compatibility across Wireloom-positive cases and the exact 7.7.0 three-peer fixture matrix, and supply-chain integrity are the primary quality goals. Generated reports record scenario totals and current outcomes; optional aggregate interoperability remains unverified.
    sources:
      - docs/architecture/arc42/10-quality-requirements.md
  risks:
    text: Coverage outside the retained corpus, coarse per-root output invalidation, fixed-limit compatibility, licensed exact-version wire environments, RTI C# binding shape limitation for direct arrays of sequences, optional aggregate wire evidence pending exact RTI 7.7.0 execution, RTI typed C++ serialization of present optional wide-string sequences (bypassed by a DynamicData C API test-peer workaround), manually maintained C++ DynamicType metadata for the wchar union, RTI 7.3.1 target compatibility, time-sensitive reader match status, high-bit character payload loss in unadapted RTI C# reference bindings, and host qualification remain open risks.
    sources:
      - docs/architecture/arc42/11-risks-and-technical-debt.md
  glossary:
    text: Connext IDL, DdsIdl root, included IDL, type-specific support, RTI oracle, wire compatibility, and wire compatibility matrix have project-specific meanings.
    sources:
      - docs/architecture/arc42/12-glossary.md
