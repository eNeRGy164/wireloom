name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  TEST_PROJECT: tests/Wireloom.Dds.Generator.Tests/Wireloom.Dds.Generator.Tests.csproj

jobs:
  coverage:
    name: Test and upload coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore $env:TEST_PROJECT --locked-mode
        shell: pwsh

      - name: Test with coverage
        run: >-
          dotnet test $env:TEST_PROJECT
          --no-restore
          --configuration Release
          --results-directory coverage
          --coverage
          --coverage-settings coverage.settings.xml
          --coverage-output coverage.cobertura.xml
          --coverage-output-format cobertura
        shell: pwsh

      - name: Run adversarial preprocessor review gate
        run: >-
          dotnet run --project $env:TEST_PROJECT
          --no-build
          --configuration Release
          --
          -namespace Wireloom.Compiler.FrontEnd.Preprocessing.Tests
        shell: pwsh

      - name: Upload coverage results to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage.cobertura.xml
          format: cobertura

  qodana:
    name: Qodana community scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Qodana community scan
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          args: >-
            --image=jetbrains/qodana-cdnet:2026.2-privileged
            --project=src/Wireloom.Dds.Generator/Wireloom.Dds.Generator.csproj
            --configuration Release
            --fail-threshold 0
            --skip-pull=false
          cache-dir: ${{ runner.temp }}/qodana/caches
          use-caches: true
          post-pr-comment: false
          upload-result: true
          artifact-name: qodana-community-report
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_646265375 }}
