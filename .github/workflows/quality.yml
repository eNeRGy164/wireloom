name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  DOTNET_NOLOGO: true
  TEST_PROJECT: tests/Wireloom.Dds.Generator.Tests/Wireloom.Dds.Generator.Tests.csproj
  FUZZING_TEST_PROJECT: tests/Wireloom.Dds.Generator.Fuzzing.Tests/Wireloom.Dds.Generator.Fuzzing.Tests.csproj
  COMPILER_TEST_PROJECT: tests/Wireloom.Dds.Compiler.Tests/Wireloom.Dds.Compiler.Tests.csproj
  RUNTIME_TEST_PROJECT: tests/Wireloom.Dds.Generator.RuntimeContracts/Wireloom.Dds.Generator.RuntimeContracts.csproj
  CORPUS_TEST_PROJECT: tests/Wireloom.Dds.Generator.CorpusCompliance/Wireloom.Dds.Generator.CorpusCompliance.csproj
  PACKAGE_PROJECT: src/Wireloom.Dds.Generator/Wireloom.Dds.Generator.csproj
  PACKAGE_INTEGRATION_TEST_PROJECT: tests/Wireloom.Dds.Generator.PackageIntegration/Wireloom.Dds.Generator.PackageIntegration.csproj

jobs:
  scope:
    name: Classify change
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Check out PR for path classification
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect narrative-only changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          full=true
          files="$RUNNER_TEMP/quality-changed-paths"
          if [[ "$EVENT_NAME" == pull_request ]] &&
             git diff --name-only --no-renames -z "$BASE_SHA" "$GITHUB_SHA" -- > "$files" &&
             [[ -s "$files" ]]; then
            full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md|CONTRIBUTING.md|SECURITY.md|docs/releases/*.md|docs/migration/*.md) ;;
                *) full=true; break ;;
              esac
            done < "$files"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0

  sample-build:
    name: Publisher/subscriber sample (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json

      - name: Restore sample dependencies
        run: dotnet restore samples/HelloWorld/HelloWorld.csproj --locked-mode

      - name: Build sample and generate its contracts
        run: dotnet build samples/HelloWorld/HelloWorld.csproj --no-restore --configuration Release

  corpus-compliance:
    name: Corpus (RTI ${{ matrix.rti_version }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rti_version: '6.1.2'
            compare_oracles: false
          - rti_version: '7.3.1'
            compare_oracles: true
          - rti_version: '7.7.0'
            compare_oracles: true
    env:
      CORPUS_RTI_PROFILE: ${{ matrix.rti_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Packages.props
            **/packages*.lock.json

      - name: Restore locked dependencies
        run: dotnet restore "$CORPUS_TEST_PROJECT" --locked-mode

      - name: Test generation and exact-runtime compilation
        run: >-
          dotnet run --project "$CORPUS_TEST_PROJECT" --no-restore --configuration Release
          -- --filter-trait CorpusSuite=Generation

      - name: Compare matching LTS oracles
        if: matrix.compare_oracles
        run: >-
          dotnet run --project "$CORPUS_TEST_PROJECT" --no-restore --configuration Release
          -- --filter-trait CorpusSuite=Oracle

  wire-harness:
    name: Wire harness (RTI ${{ matrix.rti_version }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rti_version: ['6.1.2', '7.3.1', '7.7.0']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Verify matrix applicability and shard reports
        run: |
          dotnet run --project tests/Wireloom.Dds.Generator.WireCompatibility.Verifier/Wireloom.Dds.Generator.WireCompatibility.Verifier.csproj --configuration Release
          dotnet run --project tests/Wireloom.Dds.Generator.WireCompatibility.Runner/Wireloom.Dds.Generator.WireCompatibility.Runner.csproj --configuration Release -- --verify-harness
        env:
          WIRE_COMPATIBILITY_RTI_VERSION: ${{ matrix.rti_version }}

  runtime-contracts:
    name: LTS contracts (${{ matrix.os }}, RTI ${{ matrix.rti_version }}, ${{ matrix.framework }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
        rti_version: ['6.1.2', '7.3.1', '7.7.0']
        framework: [net8.0, net10.0]
    env:
      RTI_VERSION: ${{ matrix.rti_version }}
      CONSUMER_FRAMEWORK: ${{ matrix.framework }}
      TEST_PACKAGE_VERSION: 0.4.0-lts-verification
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository SDK and .NET 8 runtime
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.426
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json

      - name: Restore locked runtime dependencies
        run: >-
          dotnet restore $env:RUNTIME_TEST_PROJECT --locked-mode
          -p:RtiConnextDdsVersion=$env:RTI_VERSION
          -p:WireloomConsumerTargetFramework=$env:CONSUMER_FRAMEWORK
        shell: pwsh

      - name: Test runtime contracts
        run: |
          New-Item -ItemType Directory -Force artifacts/lts | Out-Null
          dotnet run --project $env:RUNTIME_TEST_PROJECT --no-restore --configuration Release `
            -p:RtiConnextDdsVersion=$env:RTI_VERSION `
            -p:WireloomConsumerTargetFramework=$env:CONSUMER_FRAMEWORK |
            Tee-Object artifacts/lts/runtime-contracts.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Restore generator dependencies
        run: dotnet restore $env:PACKAGE_PROJECT --locked-mode
        shell: pwsh

      - name: Pack fresh analyzer
        run: >-
          dotnet pack $env:PACKAGE_PROJECT --no-restore --configuration Release
          --output package-test-feed -p:PackageVersion=$env:TEST_PACKAGE_VERSION
        shell: pwsh

      - name: Restore fresh-package consumer
        run: >-
          dotnet restore $env:PACKAGE_INTEGRATION_TEST_PROJECT
          --configfile tests/Wireloom.Dds.Generator.PackageIntegration/NuGet.Test.Config
          -p:WireloomDdsGeneratorPackageVersion=$env:TEST_PACKAGE_VERSION
          -p:RtiConnextDdsVersion=$env:RTI_VERSION
          -p:WireloomConsumerTargetFramework=$env:CONSUMER_FRAMEWORK
        shell: pwsh

      - name: Test fresh-package consumer with C# 12
        run: |
          dotnet run --project $env:PACKAGE_INTEGRATION_TEST_PROJECT --no-restore --configuration Release `
            -p:WireloomDdsGeneratorPackageVersion=$env:TEST_PACKAGE_VERSION `
            -p:RtiConnextDdsVersion=$env:RTI_VERSION `
            -p:WireloomConsumerTargetFramework=$env:CONSUMER_FRAMEWORK -p:LangVersion=12.0 `
            *> artifacts/lts/package-integration.txt
          $consumerExitCode = $LASTEXITCODE
          if ($consumerExitCode -ne 0) {
            Get-Content artifacts/lts/package-integration.txt
            exit $consumerExitCode
          }
          Write-Host 'Fresh-package consumer succeeded; complete build and test output is retained as an artifact.'
        shell: pwsh

      - name: Verify strict validation in the packed consumer
        run: >-
          ./tests/Wireloom.Dds.Generator.PackageIntegration/scripts/Verify-StrictConsumer.ps1
          -PackageVersion $env:TEST_PACKAGE_VERSION -RtiVersion $env:RTI_VERSION
          -Framework $env:CONSUMER_FRAMEWORK -LogPath artifacts/lts/strict-consumer.txt
        shell: pwsh

      - name: Check retained RTI C# 7.7.0 finite and unbounded alias oracles
        if: matrix.rti_version == '7.7.0' && matrix.framework == 'net10.0'
        run: |
          $probe = 'tests/Wireloom.Dds.Generator.WireCompatibility/RtiOracleProbe/RtiOracleProbe.csproj'
          dotnet restore $probe --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($oracleMode in @('finite-fallback', 'features')) {
            $probeArguments = @()
            if ($oracleMode -eq 'features') { $probeArguments += '--unbounded' }
            dotnet run --project $probe --no-restore --configuration Release `
              -p:RtiOracleProgram=UnboundedAliasProbe.cs `
              "-p:RtiOracleSourceDir=../../../docs/corpus/7.7.0/rtiddsgen/csharp/$oracleMode/*-unbounded-*-aliases" `
              -- @probeArguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        shell: pwsh

      - name: Retain LTS test output
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lts-${{ matrix.os }}-rti-${{ matrix.rti_version }}-${{ matrix.framework }}
          path: artifacts/lts/
          if-no-files-found: warn
          retention-days: 14

  net8-package-consumer:
    name: .NET 8 package consumer (RTI ${{ matrix.rti_version }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rti_version: ['6.1.2', '7.3.1', '7.7.0']
    env:
      RTI_VERSION: ${{ matrix.rti_version }}
      TEST_PACKAGE_VERSION: 0.4.0-net8-consumer
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json

      - name: Restore generator dependencies
        run: dotnet restore $env:PACKAGE_PROJECT --locked-mode
        shell: pwsh

      - name: Pack fresh analyzer
        run: >-
          dotnet pack $env:PACKAGE_PROJECT --no-restore --configuration Release
          --output package-test-feed -p:PackageVersion=$env:TEST_PACKAGE_VERSION
        shell: pwsh

      - name: Test the packed consumer with only .NET 8 installed
        run: |
          set -euo pipefail
          mkdir -p artifacts/net8-package-consumer
          docker run --rm \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/artifacts/net8-package-consumer",target=/artifacts \
            -e WIRELOOM_DDS_GENERATOR_PACKAGE_VERSION="$TEST_PACKAGE_VERSION" \
            -e RTI_CONNEXT_DDS_VERSION="$RTI_VERSION" \
            mcr.microsoft.com/dotnet/sdk:8.0.100@sha256:239eb99884b49bac13f4ff5935e118654f87b67d6e31bc842c7cd5a6c46fcc4f \
            bash -ceu '
              set -o pipefail
              mkdir -p /consumer
              cp /source/Directory.Build.props /consumer/
              cp -a /source/package-test-feed /consumer/
              mkdir -p /consumer/docs/corpus/idl
              (
                cd /source
                find tests/Wireloom.Dds.Generator.PackageIntegration \
                  tests/Wireloom.Dds.Generator.RuntimeContracts \
                  tests/PackageIntegrationIncludeDirectories \
                  -type f ! -path "*/bin/*" ! -path "*/obj/*" -print0 |
                  tar --null --files-from=- -cf -
              ) | tar -C /consumer -xf -
              mkdir -p /consumer/tests
              cp /source/tests/Directory.Build.props /consumer/tests/
              cp /source/tests/UnmarkedAdditionalFile.idl /consumer/tests/
              cp -a /source/docs/corpus/idl/integration /consumer/docs/corpus/idl/
              mkdir -p /consumer/docs/corpus/idl/features
              cp /source/docs/corpus/idl/features/06-aggregates.idl /consumer/docs/corpus/idl/features/
              cp /source/docs/corpus/idl/features/09-optional-recursive-array.idl /consumer/docs/corpus/idl/features/
              cd /consumer
              dotnet --list-sdks | tee /artifacts/dotnet-sdks.txt
              dotnet --list-runtimes | tee /artifacts/dotnet-runtimes.txt
              if dotnet --list-sdks | grep -qv "^8\\."; then
                echo "The consumer image contains an SDK other than .NET 8." >&2
                exit 1
              fi
              if dotnet --list-runtimes | grep -q "Microsoft.NETCore.App 10\\."; then
                echo "The consumer image contains a .NET 10 runtime." >&2
                exit 1
              fi
              dotnet restore tests/Wireloom.Dds.Generator.PackageIntegration/Wireloom.Dds.Generator.PackageIntegration.csproj \
                --configfile tests/Wireloom.Dds.Generator.PackageIntegration/NuGet.Test.Config \
                -p:WireloomDdsGeneratorPackageVersion="$WIRELOOM_DDS_GENERATOR_PACKAGE_VERSION" \
                -p:RtiConnextDdsVersion="$RTI_CONNEXT_DDS_VERSION" \
                -p:WireloomConsumerTargetFramework=net8.0
              if ! dotnet build tests/Wireloom.Dds.Generator.PackageIntegration/Wireloom.Dds.Generator.PackageIntegration.csproj \
                --no-restore --configuration Release \
                -p:WireloomDdsGeneratorPackageVersion="$WIRELOOM_DDS_GENERATOR_PACKAGE_VERSION" \
                -p:RtiConnextDdsVersion="$RTI_CONNEXT_DDS_VERSION" \
                -p:WireloomConsumerTargetFramework=net8.0 -p:LangVersion=12.0 \
                > /artifacts/package-consumer-build.txt 2>&1; then
                cat /artifacts/package-consumer-build.txt
                exit 1
              fi
              echo "Packed consumer build succeeded; complete build output is retained as an artifact."
              dotnet exec tests/Wireloom.Dds.Generator.PackageIntegration/bin/Release/net8.0/Wireloom.Dds.Generator.PackageIntegration.dll |
                tee /artifacts/package-integration.txt
              if dotnet build tests/Wireloom.Dds.Generator.PackageIntegration/Wireloom.Dds.Generator.PackageIntegration.csproj \
                --no-restore --configuration Release \
                -p:WireloomDdsGeneratorPackageVersion="$WIRELOOM_DDS_GENERATOR_PACKAGE_VERSION" \
                -p:RtiConnextDdsVersion="$RTI_CONNEXT_DDS_VERSION" \
                -p:WireloomConsumerTargetFramework=net8.0 -p:LangVersion=12.0 \
                -p:PackageIntegrationStrict=true > /artifacts/strict-consumer.txt 2>&1; then
                echo "Strict validation unexpectedly accepted the naming fixture." >&2
                exit 1
              fi
              grep -q "error DDSG0001:.*ignoring case" /artifacts/strict-consumer.txt
            '
        shell: bash

      - name: Retain .NET 8 consumer test output
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: net8-package-consumer-rti-${{ matrix.rti_version }}
          path: artifacts/net8-package-consumer/
          if-no-files-found: warn
          retention-days: 14

  dotnet-tests:
    name: .NET tests, coverage, and fuzzing
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json

      - name: Restore locked dependencies
        run: |
          dotnet restore $env:TEST_PROJECT --locked-mode
          dotnet restore $env:COMPILER_TEST_PROJECT --locked-mode
          dotnet restore $env:FUZZING_TEST_PROJECT --locked-mode
        shell: pwsh

      - name: Test with coverage
        run: >-
          dotnet run --project $env:TEST_PROJECT
          --no-restore
          --configuration Release
          --
          --results-directory coverage
          --coverage
          --coverage-settings coverage.settings.xml
          --coverage-output generator.cobertura.xml
          --coverage-output-format cobertura
        shell: pwsh

      - name: Test compiler core with coverage
        run: >-
          dotnet run --project $env:COMPILER_TEST_PROJECT
          --no-restore
          --configuration Release
          --
          --results-directory coverage
          --coverage
          --coverage-settings coverage.settings.xml
          --coverage-output compiler.cobertura.xml
          --coverage-output-format cobertura
        shell: pwsh

      - name: Enforce compiler branch and line coverage
        run: |
          [xml]$report = Get-Content -LiteralPath 'coverage/compiler.cobertura.xml'
          $branchRate = [double]$report.coverage.GetAttribute('branch-rate')
          $lineRate = [double]$report.coverage.GetAttribute('line-rate')
          if ($branchRate -lt 0.90) {
            throw "Compiler branch coverage $([math]::Round($branchRate * 100, 2))% is below 90%."
          }
          if ($lineRate -lt 0.95) {
            throw "Compiler line coverage $([math]::Round($lineRate * 100, 2))% is below 95%."
          }
          Write-Host "Compiler coverage: $([math]::Round($branchRate * 100, 2))% branches, $([math]::Round($lineRate * 100, 2))% lines."
        shell: pwsh

      - name: Test Playground adapter with coverage
        run: >-
          dotnet run --project $env:COMPILER_TEST_PROJECT
          --no-restore
          --configuration Release
          --
          --results-directory coverage
          --filter-class Wireloom.Compiler.Tests.Playground.PlaygroundCompilerAdapterSpecs
          --coverage
          --coverage-settings coverage.playground.settings.xml
          --coverage-output playground.cobertura.xml
          --coverage-output-format cobertura
        shell: pwsh

      - name: Run IDL FsCheck fuzzing gate
        run: >-
          dotnet run --project $env:FUZZING_TEST_PROJECT
          --no-restore
          --configuration Release
          --
          --filter-class Wireloom.Dds.Generator.Fuzzing.Tests.FsCheckIdlCompilerFuzzingSpecs
        shell: pwsh
        env:
          WIRELOOM_FSCHECK_TESTS: 10000

      - name: Retain .NET coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dotnet-coverage
          path: coverage/*.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  playground-build:
    name: Playground client and Release bundles
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json

      - name: Set up pinned Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: playground/.node-version
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Set up pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Restore locked Playground dependencies
        run: npm ci --ignore-scripts
        working-directory: playground

      - name: Check and test Playground client
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          node --test scripts/pages-manifest.test.mjs
          npm run coverage
          npm audit --audit-level=low
        working-directory: playground

      - name: Build and verify Playground bundles
        run: |
          npm run build
          npm run check:paths
        working-directory: playground

      - name: Archive browser job inputs
        run: |
          tar -cf "$RUNNER_TEMP/playground-inputs.tar" \
            playground/dist playground/dist-subpath playground/public/dotnet \
            playground/coverage/unit/coverage-final.json

      - name: Retain browser job inputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playground-inputs
          path: ${{ runner.temp }}/playground-inputs.tar
          if-no-files-found: error
          retention-days: 1

  browser-coverage:
    name: Playground browser coverage
    needs: playground-build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json

      - name: Set up pinned Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: playground/.node-version
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Set up pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Restore locked Playground dependencies
        run: npm ci --ignore-scripts
        working-directory: playground

      - name: Download same-run browser job inputs
        uses: actions/download-artifact@v8.0.2
        with:
          name: playground-inputs
          path: ${{ runner.temp }}

      - name: Extract browser job inputs
        run: tar -xf "$RUNNER_TEMP/playground-inputs.tar"

      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: playground

      - name: Measure browser coverage
        run: |
          npm run build:coverage
          npm run coverage:browser
        working-directory: playground

      - name: Retain browser coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playground-coverage
          path: |
            playground/coverage/cobertura-coverage.xml
            playground/coverage/browser-summary.json
          if-no-files-found: error
          retention-days: 14

  playground-qualification:
    name: Playground qualification and Pages candidate
    needs: playground-build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json

      - name: Set up pinned Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: playground/.node-version
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Set up pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Restore locked Playground dependencies
        run: npm ci --ignore-scripts
        working-directory: playground

      - name: Download same-run browser job inputs
        uses: actions/download-artifact@v8.0.2
        with:
          name: playground-inputs
          path: ${{ runner.temp }}

      - name: Extract browser job inputs
        run: tar -xf "$RUNNER_TEMP/playground-inputs.tar"

      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: playground

      - name: Verify published Playground against native corpus expectations
        run: npm run verify:release -- chromium
        working-directory: playground

      - name: Build and verify Pages deployment candidate
        run: |
          npm run build:pages
          npm run verify:pages
        working-directory: playground
        env:
          PLAYGROUND_BASE_PATH: ${{ vars.PLAYGROUND_BASE_PATH || '/wireloom/' }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}

      - name: Retain validated Pages candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playground-pages
          path: playground/dist-pages/
          if-no-files-found: error
          retention-days: 30

      - name: Retain Playground qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playground-qualification
          path: |
            output/playwright/qualification-chromium.json
            output/playwright/qualification-chromium.log
            output/playwright/*-native-baseline.json
            output/playwright/native-baseline.json
            output/playwright/corpus-inputs.json
            output/playwright/pages-smoke.json
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Upload combined coverage
    needs: [dotnet-tests, browser-coverage]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download .NET coverage
        uses: actions/download-artifact@v8.0.2
        with:
          name: dotnet-coverage
          path: coverage

      - name: Download Playground coverage
        uses: actions/download-artifact@v8.0.2
        with:
          name: playground-coverage
          path: playground/coverage

      - name: Retain combined coverage reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: combined-coverage
          path: |
            coverage/*.cobertura.xml
            playground/coverage/cobertura-coverage.xml
            playground/coverage/browser-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiler, generator, and Playground coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: cobertura
          files: coverage/generator.cobertura.xml coverage/compiler.cobertura.xml coverage/playground.cobertura.xml playground/coverage/cobertura-coverage.xml

  qodana:
    name: Qodana community scan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Run Qodana community scan
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: >-
            --image=jetbrains/qodana-cdnet:2026.2-privileged
            --solution=Wireloom.slnx
            --configuration Release
            --fail-threshold 0
            --skip-pull=false
            --log-level info
          env-vars-to-linter: DOTNET_CLI_TELEMETRY_OPTOUT
          results-dir: ${{ runner.temp }}/qodana/results
          cache-dir: ${{ runner.temp }}/qodana/caches
          use-caches: true
          primary-cache-key: qodana-2026.2-wireloom
          cache-default-branch-only: true
          post-pr-comment: false
          # Upload the directory directly to avoid Qodana's nested ZIP with rooted paths.
          upload-result: false

      - name: Retain Qodana report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qodana-community-report
          path: ${{ runner.temp }}/qodana/results/
          if-no-files-found: warn
          retention-days: 90

  quality-result:
    name: Quality result
    needs:
      - scope
      - dependency-review
      - sample-build
      - corpus-compliance
      - wire-harness
      - runtime-contracts
      - net8-package-consumer
      - dotnet-tests
      - playground-build
      - browser-coverage
      - playground-qualification
      - coverage
      - qodana
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check applicable job results
        shell: bash
        env:
          JOBS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ needs.scope.outputs.full }}
        run: |
          jq -e --arg event "$EVENT_NAME" --arg full "$FULL" '
            to_entries
            | map(. + {expected: (
                if .key == "scope" or .key == "qodana" then "success"
                elif .key == "dependency-review" then
                  if $event == "pull_request" then "success" else "skipped" end
                elif $full == "false" then "skipped"
                else "success"
                end
              )})
            | map(select(.value.result != .expected))
            | if length == 0 then true else error(tostring) end
          ' <<< "$JOBS"
