name: Mutation testing

on:
  workflow_dispatch:
  # Add a scheduled trigger after the initial mutation baseline is reviewed.

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  TEST_PROJECT: tests/Wireloom.Dds.Generator.Tests/Wireloom.Dds.Generator.Tests.csproj

jobs:
  mutation:
    name: Advisory mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore $env:TEST_PROJECT --locked-mode
        shell: pwsh

      - name: Restore pinned Stryker tool
        run: dotnet tool restore
        shell: pwsh

      - name: Run mutation testing
        run: dotnet tool run dotnet-stryker -- --config-file stryker-config.json
        shell: pwsh

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-reports
          path: StrykerOutput/**/reports/*
          if-no-files-found: warn
          retention-days: 14
