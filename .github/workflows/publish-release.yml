name: Publish release package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  PACKAGE_PROJECT: src/Wireloom.Dds.Generator/Wireloom.Dds.Generator.csproj
  TEST_PROJECT: tests/Wireloom.Dds.Generator.Tests/Wireloom.Dds.Generator.Tests.csproj
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

jobs:
  package:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.x

      - name: Calculate release version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          targetPath: ${{ github.workspace }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: |
          if [ "$RELEASE_TAG" != "v$GITVERSION_SEMVER" ]; then
            echo "Release tag $RELEASE_TAG does not match GitVersion v$GITVERSION_SEMVER" >&2
            exit 1
          fi

      - name: Restore locked dependencies
        run: dotnet restore $env:TEST_PROJECT --locked-mode
        shell: pwsh

      - name: Test
        run: dotnet test $env:TEST_PROJECT --no-restore --configuration Release
        shell: pwsh

      - name: Pack release package
        run: >-
          dotnet pack $env:PACKAGE_PROJECT
          --no-restore
          --configuration Release
          --output $env:ARTIFACTS_DIR
          /p:Version=${{ steps.gitversion.outputs.nuGetVersionV2 }}
          /p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersionV2 }}
        shell: pwsh

      - name: Generate SBOM
        uses: anchore/sbom-action@9246b90769f852b3a8921f330c59e0b3f439d6e9 # v0.20.1
        with:
          path: ${{ env.ARTIFACTS_DIR }}
          format: cyclonedx-json
          output-file: ${{ env.ARTIFACTS_DIR }}/wireloom-dds-generator.sbom.cdx.json
          artifact-name: wireloom-dds-generator-release.sbom.cdx.json

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACTS_DIR }}/*.nupkg

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACTS_DIR }}/*.nupkg
          sbom-path: ${{ env.ARTIFACTS_DIR }}/wireloom-dds-generator.sbom.cdx.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wireloom-dds-generator-release-${{ steps.gitversion.outputs.nuGetVersionV2 }}
          path: ${{ env.ARTIFACTS_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Exchange GitHub OIDC token for NuGet credential
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish release to NuGet.org
        run: |
          $package = Get-ChildItem -LiteralPath $env:ARTIFACTS_DIR -Filter '*.nupkg' | Select-Object -First 1
          if ($null -eq $package) { throw 'No NuGet package was produced.' }
          dotnet nuget push $package.FullName `
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
        shell: pwsh
