name: Publish release package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  PACKAGE_PROJECT: src/Wireloom.Dds.CSharp.Generator/Wireloom.Dds.CSharp.Generator.csproj
  PACKAGE_INTEGRATION_TEST_PROJECT: tests/Wireloom.Dds.CSharp.Generator.PackageIntegration/Wireloom.Dds.CSharp.Generator.PackageIntegration.csproj
  PACKAGE_TEST_FEED: ${{ github.workspace }}/package-test-feed
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

jobs:
  select:
    name: Select qualified release
    if: >-
      github.repository == 'eNeRGy164/wireloom' &&
      (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main revision has Quality and wire evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$revision" refs/remotes/origin/main
          for workflow in quality.yml wire-compatibility.yml; do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f branch=main -f head_sha="$revision" -f per_page=100 |
              jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$revision" --arg workflow "$workflow" '
                [.workflow_runs[]
                 | select(.path == (".github/workflows/" + $workflow) and
                     .head_sha == $sha and .head_branch == "main" and
                     .head_repository.full_name == $repo and
                     (.event == "push" or .event == "workflow_dispatch") and
                     .status == "completed" and
                     .conclusion != "cancelled" and .conclusion != "skipped")]
                | first
                | select(.conclusion == "success")
                | .id
              ' > "$RUNNER_TEMP/$workflow.run" ||
              { echo "No successful $workflow qualification for $revision." >&2; exit 1; }
          done
          wire_run=$(cat "$RUNNER_TEMP/wire-compatibility.yml.run")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$wire_run/artifacts?per_page=100" |
            jq -e '
              [.artifacts[] | select(.expired == false) | .name]
              | contains(["wire-compatibility-rti-6.1.2", "wire-compatibility-rti-7.3.1", "wire-compatibility-rti-7.7.0"])
            '

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.x

      - name: Calculate release version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          targetPath: ${{ github.workspace }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: |
          if [ "$RELEASE_TAG" != "v$GITVERSION_SEMVER" ]; then
            echo "Release tag $RELEASE_TAG does not match GitVersion v$GITVERSION_SEMVER" >&2
            exit 1
          fi

      - name: Retain selected source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cpp:
    name: Build and verify native package
    needs: select
    if: needs.select.outputs.revision != ''
    permissions:
      contents: read
    uses: ./.github/workflows/cpp-package.yml
    with:
      revision: ${{ needs.select.outputs.revision }}
      package_version: ${{ needs.select.outputs.version }}

  package:
    name: Build and attest release
    needs: [select, cpp]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select.outputs.revision }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json

      - name: Restore generator dependencies
        run: dotnet restore "$PACKAGE_PROJECT" --locked-mode

      - name: Pack versioned candidate
        env:
          PACKAGE_VERSION: ${{ needs.select.outputs.version }}
        run: >-
          dotnet pack "$PACKAGE_PROJECT" --no-restore --configuration Release
          --output "$PACKAGE_TEST_FEED" -p:Version="$PACKAGE_VERSION" -p:PackageVersion="$PACKAGE_VERSION"

      - name: Smoke-test the exact candidate package with C# 12
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/candidate-nuget-packages
          PACKAGE_VERSION: ${{ needs.select.outputs.version }}
        run: |
          dotnet restore "$PACKAGE_INTEGRATION_TEST_PROJECT" \
            --configfile tests/Wireloom.Dds.CSharp.Generator.PackageIntegration/NuGet.Test.Config \
            -p:WireloomDdsGeneratorPackageVersion="$PACKAGE_VERSION"
          dotnet run --project "$PACKAGE_INTEGRATION_TEST_PROJECT" --no-restore --configuration Release \
            -p:WireloomDdsGeneratorPackageVersion="$PACKAGE_VERSION" -p:LangVersion=12.0

      - name: Stage the tested package for publication
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          cp "$PACKAGE_TEST_FEED"/*.nupkg "$ARTIFACTS_DIR"/

      - name: Stage the tested native package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.select.outputs.version }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name cpp-nuget --dir "$ARTIFACTS_DIR"
          test -f "$ARTIFACTS_DIR/Wireloom.Dds.Cpp.Generator.$PACKAGE_VERSION.nupkg"

      - name: Retain exact package hashes
        run: |
          cd "$ARTIFACTS_DIR"
          sha256sum ./*.nupkg > SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: ${{ env.ARTIFACTS_DIR }}
          format: cyclonedx-json
          output-file: ${{ env.ARTIFACTS_DIR }}/wireloom-dds-generator.sbom.cdx.json
          artifact-name: wireloom-dds-generator-release.sbom.cdx.json
          # Immutable GitHub releases reject post-publication asset uploads.
          # The SBOM remains available through upload-artifact and is attested below.
          upload-release-assets: false

      - name: Attest package provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ env.ARTIFACTS_DIR }}/*.nupkg

      - name: Attest SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ env.ARTIFACTS_DIR }}/*.nupkg
          sbom-path: ${{ env.ARTIFACTS_DIR }}/wireloom-dds-generator.sbom.cdx.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wireloom-dds-generator-release-${{ needs.select.outputs.version }}
          path: ${{ env.ARTIFACTS_DIR }}
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish tested release packages
    needs: [select, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select.outputs.revision }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Download and verify retained publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.select.outputs.version }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "wireloom-dds-generator-release-$PACKAGE_VERSION" --dir "$ARTIFACTS_DIR"
          cd "$ARTIFACTS_DIR"
          sha256sum --check SHA256SUMS

      - name: Exchange GitHub OIDC token for NuGet credential
        uses: NuGet/login@v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish release packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath $env:ARTIFACTS_DIR -Filter '*.nupkg')
          if ($packages.Count -ne 2) { throw 'Expected the tested C# and C++ packages.' }
          foreach ($package in $packages) {
            $pushArguments = @(
              $package.FullName,
              '--source', 'https://api.nuget.org/v3/index.json',
              '--api-key', $env:NUGET_API_KEY,
              '--skip-duplicate'
            )
            dotnet nuget push @pushArguments
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
