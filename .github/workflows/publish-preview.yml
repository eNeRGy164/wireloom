name: Publish preview package

on:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]
  # Keep the existing required check present until the main ruleset is migrated.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  PACKAGE_PROJECT: src/Wireloom.Dds.CSharp.Generator/Wireloom.Dds.CSharp.Generator.csproj
  PACKAGE_INTEGRATION_TEST_PROJECT: tests/Wireloom.Dds.CSharp.Generator.PackageIntegration/Wireloom.Dds.CSharp.Generator.PackageIntegration.csproj
  PACKAGE_TEST_FEED: ${{ github.workspace }}/package-test-feed
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

jobs:
  select:
    name: Select trusted Quality run
    if: >-
      github.repository == 'eNeRGy164/wireloom' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Select verified main revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RUN: ${{ github.event.workflow_run.id }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$REVISION" != "$current" ]]; then
            echo "A newer main revision superseded $REVISION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$QUALITY_RUN" ]]; then
            QUALITY_RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality.yml \
              --branch main --event push --commit "$REVISION" --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
          fi
          [[ "$QUALITY_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALITY_RUN" |
            jq -e --arg repository "$GITHUB_REPOSITORY" --arg sha "$REVISION" '
              .path == ".github/workflows/quality.yml" and .head_sha == $sha and
              .head_repository.full_name == $repository and .head_branch == "main" and
              .event == "push" and .status == "completed" and .conclusion == "success"
            '
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Check out selected revision
        if: steps.source.outputs.revision != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        if: steps.source.outputs.revision != ''
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Set up GitVersion
        if: steps.source.outputs.revision != ''
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.x

      - name: Calculate package version
        id: gitversion
        if: steps.source.outputs.revision != ''
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          targetPath: ${{ github.workspace }}

  cpp:
    name: Build and verify native package
    needs: select
    if: needs.select.outputs.revision != ''
    permissions:
      contents: read
    uses: ./.github/workflows/cpp-package.yml
    with:
      revision: ${{ needs.select.outputs.revision }}
      package_version: ${{ needs.select.outputs.version }}

  package:
    name: Build and attest preview
    needs: [select, cpp]
    if: needs.select.outputs.revision != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages*.lock.json

      - name: Restore generator dependencies
        run: dotnet restore "$PACKAGE_PROJECT" --locked-mode

      - name: Pack versioned candidate
        env:
          PACKAGE_VERSION: ${{ needs.select.outputs.version }}
        run: >-
          dotnet pack "$PACKAGE_PROJECT" --no-restore --configuration Release
          --output "$PACKAGE_TEST_FEED" -p:Version="$PACKAGE_VERSION" -p:PackageVersion="$PACKAGE_VERSION"

      - name: Smoke-test the exact candidate package with C# 12
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/candidate-nuget-packages
          PACKAGE_VERSION: ${{ needs.select.outputs.version }}
        run: |
          dotnet restore "$PACKAGE_INTEGRATION_TEST_PROJECT" \
            --configfile tests/Wireloom.Dds.CSharp.Generator.PackageIntegration/NuGet.Test.Config \
            -p:WireloomDdsGeneratorPackageVersion="$PACKAGE_VERSION"
          dotnet run --project "$PACKAGE_INTEGRATION_TEST_PROJECT" --no-restore --configuration Release \
            -p:WireloomDdsGeneratorPackageVersion="$PACKAGE_VERSION" -p:LangVersion=12.0

      - name: Stage the tested package for publication
        run: |
          mkdir -p "$ARTIFACTS_DIR"
          cp "$PACKAGE_TEST_FEED"/*.nupkg "$ARTIFACTS_DIR"/

      - name: Stage the tested native package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.select.outputs.version }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name cpp-nuget --dir "$ARTIFACTS_DIR"
          test -f "$ARTIFACTS_DIR/Wireloom.Dds.Cpp.Generator.$PACKAGE_VERSION.nupkg"

      - name: Retain exact package hashes
        run: |
          cd "$ARTIFACTS_DIR"
          sha256sum ./*.nupkg > SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: ${{ env.ARTIFACTS_DIR }}
          format: cyclonedx-json
          output-file: ${{ env.ARTIFACTS_DIR }}/wireloom-dds-generator.sbom.cdx.json
          artifact-name: wireloom-dds-generator-preview.sbom.cdx.json

      - name: Attest package provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ env.ARTIFACTS_DIR }}/*.nupkg

      - name: Attest SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ env.ARTIFACTS_DIR }}/*.nupkg
          sbom-path: ${{ env.ARTIFACTS_DIR }}/wireloom-dds-generator.sbom.cdx.json

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wireloom-dds-generator-preview-${{ needs.select.outputs.version }}
          path: ${{ env.ARTIFACTS_DIR }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tested preview packages
    needs: [select, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: preview-package-main
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select.outputs.revision }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Download and verify retained publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.select.outputs.version }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "wireloom-dds-generator-preview-$PACKAGE_VERSION" --dir "$ARTIFACTS_DIR"
          cd "$ARTIFACTS_DIR"
          sha256sum --check SHA256SUMS

      - name: Publish preview to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ needs.select.outputs.revision }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "A newer main revision superseded $EXPECTED_SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          packages=("$ARTIFACTS_DIR"/*.nupkg)
          [[ "${#packages[@]}" -eq 2 ]]
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/$REPOSITORY_OWNER/index.json" \
              --api-key "$GH_TOKEN" --skip-duplicate
          done
