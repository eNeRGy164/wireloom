name: Wire compatibility

on:
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - docs/releases/**.md
      - docs/migration/**.md
      - playground/**
      - src/Wireloom.Playground.Browser/**
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - docs/releases/**.md
      - docs/migration/**.md
      - playground/**
      - src/Wireloom.Playground.Browser/**
  workflow_dispatch:
    inputs:
      shards_per_profile:
        description: Number of complete case partitions per RTI profile
        type: choice
        options: ['4', '6', '8']
        default: '4'
        required: true

permissions:
  contents: read

concurrency:
  group: wire-compatibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan wire shards
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-26.04
    environment: wire-compatibility
    timeout-minutes: 5
    outputs:
      count: ${{ steps.shards.outputs.count }}
      indices: ${{ steps.shards.outputs.indices }}
    steps:
      - name: Select shard count and indices
        id: shards
        shell: bash
        env:
          SHARDS: ${{ inputs.shards_per_profile || '4' }}
          RTI_CONNEXT_LICENSE: ${{ secrets.RTI_CONNEXT_LICENSE }}
        run: |
          if [[ -z "$RTI_CONNEXT_LICENSE" ]]; then
            if [[ "$GITHUB_REPOSITORY" == eNeRGy164/wireloom || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              echo "::error::Set the RTI_CONNEXT_LICENSE Actions secret for licensed wire checks."
              exit 1
            fi
            echo "Skipping licensed wire checks because RTI_CONNEXT_LICENSE is unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$SHARDS" in
            4|6|8) ;;
            *) echo "Unsupported shard count: $SHARDS" >&2; exit 1 ;;
          esac
          echo "count=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "indices=$(jq -cn --argjson count "$SHARDS" '[range($count)]')" >> "$GITHUB_OUTPUT"

  wire-shards:
    name: ${{ matrix.rti_version }} wire test shard ${{ matrix.shard }}
    runs-on: ubuntu-26.04
    needs: plan
    if: needs.plan.outputs.count != ''
    environment: wire-compatibility
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        rti_version: ['6.1.2', '7.3.1', '7.7.0']
        shard: ${{ fromJSON(needs.plan.outputs.indices) }}
        include:
          - rti_version: '6.1.2'
            rti_package_version: 6.1.2.0-5-4bullseye
          - rti_version: '7.3.1'
            rti_package_version: 7.3.1.0-1-1bullseye
          - rti_version: '7.7.0'
            rti_package_version: 7.7.0.0-1-1bookworm
    env:
      WIRE_COMPATIBILITY_RTI_VERSION: ${{ matrix.rti_version }}
      WIRE_COMPATIBILITY_OUTPUT_DIR: artifacts/wire-compatibility-rti-${{ matrix.rti_version }}
      WIRE_COMPATIBILITY_SHARD_INDEX: ${{ matrix.shard }}
      WIRE_COMPATIBILITY_SHARD_COUNT: ${{ needs.plan.outputs.count }}
      WIRE_COMPATIBILITY_MAX_CONCURRENCY: 16
      WIRE_COMPATIBILITY_CSHARP_BUILD_CONCURRENCY: 4
      WIRE_COMPATIBILITY_CASE_BUILD_CONCURRENCY: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build cached wire execution image
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: tests/Wireloom.Dds.Generator.WireCompatibility
          file: tests/Wireloom.Dds.Generator.WireCompatibility/Containerfile.wire
          tags: wireloom-wire-${{ matrix.rti_version }}:local
          build-args: |
            RTI_VERSION=${{ matrix.rti_version }}
            RTI_PACKAGE_VERSION=${{ matrix.rti_package_version }}
          load: true
          cache-from: type=gha,scope=wireloom-wire-${{ matrix.rti_version }}
          cache-to: ${{ github.event_name != 'pull_request' && matrix.shard == 0 && format('type=gha,scope=wireloom-wire-{0},mode=min', matrix.rti_version) || '' }}

      - name: Identify C++ compiler for cache
        id: cpp_toolchain
        shell: bash
        run: |
          image="wireloom-wire-${WIRE_COMPATIBILITY_RTI_VERSION}:local"
          version="$(docker run --rm --entrypoint g++ "$image" -dumpfullversion -dumpversion)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          source_hash="${{ hashFiles('tests/Wireloom.Dds.Generator.WireCompatibility/Containerfile.wire', 'tests/Wireloom.Dds.Generator.WireCompatibility/Native/**', 'tests/Wireloom.Dds.Generator.WireCompatibility.Shared/**', 'tests/Wireloom.Dds.Generator.WireCompatibility.Runner/**', 'tests/Wireloom.Dds.Generator.WireCompatibility.Verifier/**', 'src/Wireloom.Dds.Idl/**', 'docs/corpus/manifest.json', 'docs/corpus/**/rtiddsgen/wire-oracles.json', 'docs/corpus/**/rtiddsgen/cpp/**', 'docs/corpus/7.7.0/cpp-evidence/type-scope.json') }}"
          echo "source_hash=$source_hash" >> "$GITHUB_OUTPUT"

      - name: Prepare persistent build caches
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/wireloom-cache/ccache" "$RUNNER_TEMP/wireloom-cache/nuget"

      - name: Restore C++ compiler outputs
        id: ccache-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/wireloom-cache/ccache
          key: ccache-${{ runner.os }}-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-g++-${{ steps.cpp_toolchain.outputs.version }}-${{ env.WIRE_COMPATIBILITY_SHARD_COUNT }}-shards-${{ matrix.shard }}-${{ steps.cpp_toolchain.outputs.source_hash }}
          restore-keys: |
            ccache-${{ runner.os }}-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-g++-${{ steps.cpp_toolchain.outputs.version }}-${{ env.WIRE_COMPATIBILITY_SHARD_COUNT }}-shards-${{ matrix.shard }}-
            ccache-${{ runner.os }}-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-g++-${{ steps.cpp_toolchain.outputs.version }}-
            ccache-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-${{ env.WIRE_COMPATIBILITY_SHARD_COUNT }}-shards-${{ matrix.shard }}-
            ccache-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-

      - name: Restore NuGet packages
        id: nuget-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/wireloom-cache/nuget
          key: nuget-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-${{ hashFiles('Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json', 'src/Wireloom.Dds.CSharp.Compiler/Wireloom.Dds.CSharp.Compiler.csproj', 'src/Wireloom.Dds.CSharp.Compiler/packages.lock.json', 'src/Wireloom.Dds.CSharp.Generator/Wireloom.Dds.CSharp.Generator.csproj', 'src/Wireloom.Dds.Idl/Wireloom.Dds.Idl.csproj', 'src/Wireloom.Dds.Idl/packages.lock.json', 'src/Wireloom.Dds.Cpp.Generator/Wireloom.Dds.Cpp.Generator.csproj', 'src/Wireloom.Dds.Cpp.Generator/packages.lock.json', 'tests/Wireloom.Dds.Generator.WireCompatibility/Wireloom.Dds.Generator.WireCompatibility.csproj') }}
          restore-keys: |
            nuget-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-

      - name: Provide runtime RTI license file
        shell: bash
        env:
          RTI_CONNEXT_LICENSE: ${{ secrets.RTI_CONNEXT_LICENSE }}
        run: |
          if [[ -z "$RTI_CONNEXT_LICENSE" ]]; then
            echo "The RTI_CONNEXT_LICENSE environment secret is required for licensed wire checks." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$RTI_CONNEXT_LICENSE" > "$RUNNER_TEMP/rti_license.dat"

      - name: Run ${{ matrix.rti_version }} wire matrix
        shell: bash
        run: |
          docker run --rm --user 0:0 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/wireloom-cache/ccache:/root/.cache/ccache" \
            --volume "$RUNNER_TEMP/wireloom-cache/nuget:/root/.nuget/packages" \
            --volume "$RUNNER_TEMP/rti_license.dat:/run/secrets/rti_license.dat:ro" \
            --workdir /workspace \
            --env GITHUB_WORKSPACE=/workspace \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/workspace \
            --env RTI_LICENSE_FILE=/run/secrets/rti_license.dat \
            --env NUGET_PACKAGES=/root/.nuget/packages \
            --env CCACHE_DIR=/root/.cache/ccache \
            --env CCACHE_MAXSIZE=2G \
            --env WIRE_COMPATIBILITY_RTI_VERSION="$WIRE_COMPATIBILITY_RTI_VERSION" \
            --env WIRE_COMPATIBILITY_OUTPUT_DIR="$WIRE_COMPATIBILITY_OUTPUT_DIR" \
            --env WIRE_COMPATIBILITY_SHARD_INDEX="$WIRE_COMPATIBILITY_SHARD_INDEX" \
            --env WIRE_COMPATIBILITY_SHARD_COUNT="$WIRE_COMPATIBILITY_SHARD_COUNT" \
            --env WIRE_COMPATIBILITY_MAX_CONCURRENCY="$WIRE_COMPATIBILITY_MAX_CONCURRENCY" \
            --env WIRE_COMPATIBILITY_CSHARP_BUILD_CONCURRENCY="$WIRE_COMPATIBILITY_CSHARP_BUILD_CONCURRENCY" \
            --env WIRE_COMPATIBILITY_CASE_BUILD_CONCURRENCY="$WIRE_COMPATIBILITY_CASE_BUILD_CONCURRENCY" \
            --entrypoint dotnet \
            "wireloom-wire-$WIRE_COMPATIBILITY_RTI_VERSION:local" \
            run --project tests/Wireloom.Dds.Generator.WireCompatibility.Runner/Wireloom.Dds.Generator.WireCompatibility.Runner.csproj --configuration Release

      - name: Save C++ compiler outputs
        if: success() && github.event_name != 'pull_request' && steps.ccache-cache.outcome == 'success' && steps.ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/wireloom-cache/ccache
          key: ccache-${{ runner.os }}-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-g++-${{ steps.cpp_toolchain.outputs.version }}-${{ env.WIRE_COMPATIBILITY_SHARD_COUNT }}-shards-${{ matrix.shard }}-${{ steps.cpp_toolchain.outputs.source_hash }}

      - name: Save NuGet packages
        if: success() && github.event_name != 'pull_request' && matrix.shard == 0 && steps.nuget-cache.outcome == 'success' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/wireloom-cache/nuget
          key: nuget-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-${{ hashFiles('Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json', 'src/Wireloom.Dds.CSharp.Compiler/Wireloom.Dds.CSharp.Compiler.csproj', 'src/Wireloom.Dds.CSharp.Compiler/packages.lock.json', 'src/Wireloom.Dds.CSharp.Generator/Wireloom.Dds.CSharp.Generator.csproj', 'src/Wireloom.Dds.Idl/Wireloom.Dds.Idl.csproj', 'src/Wireloom.Dds.Idl/packages.lock.json', 'src/Wireloom.Dds.Cpp.Generator/Wireloom.Dds.Cpp.Generator.csproj', 'src/Wireloom.Dds.Cpp.Generator/packages.lock.json', 'tests/Wireloom.Dds.Generator.WireCompatibility/Wireloom.Dds.Generator.WireCompatibility.csproj') }}

      - name: Upload sanitized wire evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wire-compatibility-rti-${{ matrix.rti_version }}-${{ needs.plan.outputs.count }}-shards-${{ matrix.shard }}
          path: |
            artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/results.json
            artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/results.md
            artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/logs/
            artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/raw/
            artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/scenarios.tsv
            artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/plan.json
            artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/shard.json
            artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/execution-provenance.json
            artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/source-files/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove runtime license file
        if: always()
        run: rm -f "$RUNNER_TEMP/rti_license.dat"

  report:
    name: ${{ matrix.rti_version }} wire test results
    needs: [plan, wire-shards]
    if: always() && needs.plan.outputs.count != '' && !cancelled()
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rti_version: ['6.1.2', '7.3.1', '7.7.0']
    env:
      WIRE_COMPATIBILITY_RTI_VERSION: ${{ matrix.rti_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Download shard evidence
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: wire-compatibility-rti-${{ matrix.rti_version }}-${{ needs.plan.outputs.count }}-shards-*
          path: artifacts/wire-shards

      - name: Validate and combine all exchanges
        run: >-
          dotnet run --project tests/Wireloom.Dds.Generator.WireCompatibility.Verifier/Wireloom.Dds.Generator.WireCompatibility.Verifier.csproj
          --configuration Release -- merge-shards ${{ matrix.rti_version }} ${{ needs.plan.outputs.count }} artifacts/wire-shards artifacts/wire-compatibility-rti-${{ matrix.rti_version }}
          tests/Wireloom.Dds.Generator.WireCompatibility/wire-case-exclusions-${{ matrix.rti_version }}.json

      - name: Publish combined wire matrix summary
        if: always()
        shell: bash
        run: |
          report=artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/results.md
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Shard evidence could not be combined. Check shard setup and merge diagnostics." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload combined wire evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wire-compatibility-rti-${{ matrix.rti_version }}
          path: artifacts/wire-compatibility-rti-${{ matrix.rti_version }}/
          if-no-files-found: error
          retention-days: 14
