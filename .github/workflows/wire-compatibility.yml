name: Wire compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wire-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rti-7-7-0:
    name: RTI Connext 7.7.0 wire shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      WIRE_COMPATIBILITY_RTI_VERSION: 7.7.0
      WIRE_COMPATIBILITY_OUTPUT_DIR: artifacts/wire-compatibility
      WIRE_COMPATIBILITY_SHARD_INDEX: ${{ matrix.shard }}
      WIRE_COMPATIBILITY_SHARD_COUNT: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build cached RTI test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: .
          file: tests/Wireloom.Dds.Generator.WireCompatibility/Containerfile
          tags: wireloom-rti-7.7.0:local
          load: true
          cache-from: type=gha,scope=wireloom-rti-7.7.0
          cache-to: ${{ matrix.shard == 0 && 'type=gha,scope=wireloom-rti-7.7.0,mode=max' || '' }}

      - name: Prepare persistent build caches
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/wireloom-cache/ccache" "$RUNNER_TEMP/wireloom-cache/nuget"

      - name: Restore C++ compiler outputs
        id: ccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wireloom-cache/ccache
          key: ccache-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-shard-${{ matrix.shard }}-
            ccache-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-

      - name: Restore NuGet packages
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wireloom-cache/nuget
          key: nuget-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-${{ hashFiles('Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json', 'src/Wireloom.Dds.Generator/Wireloom.Dds.Generator.csproj', 'tests/Wireloom.Dds.Generator.WireCompatibility/Wireloom.Dds.Generator.WireCompatibility.csproj') }}
          restore-keys: |
            nuget-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-

      - name: Provide runtime RTI license file
        shell: bash
        env:
          RTI_CONNEXT_LICENSE: ${{ secrets.RTI_CONNEXT_LICENSE }}
        run: |
          if [[ -z "$RTI_CONNEXT_LICENSE" ]]; then
            echo "The RTI_CONNEXT_LICENSE secret is required for this manually dispatched workflow." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$RTI_CONNEXT_LICENSE" > "$RUNNER_TEMP/rti_license.dat"

      - name: Verify RTI toolchain and run 7.7.0 wire matrix
        shell: bash
        run: |
          docker run --rm --user 0:0 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/wireloom-cache/ccache:/root/.cache/ccache" \
            --volume "$RUNNER_TEMP/wireloom-cache/nuget:/root/.nuget/packages" \
            --volume "$RUNNER_TEMP/rti_license.dat:/run/secrets/rti_license.dat:ro" \
            --workdir /workspace \
            --env GITHUB_WORKSPACE=/workspace \
            --env RTI_LICENSE_FILE=/run/secrets/rti_license.dat \
            --env NUGET_PACKAGES=/root/.nuget/packages \
            --env CCACHE_DIR=/root/.cache/ccache \
            --env CCACHE_MAXSIZE=2G \
            --env WIRE_COMPATIBILITY_RTI_VERSION="$WIRE_COMPATIBILITY_RTI_VERSION" \
            --env WIRE_COMPATIBILITY_OUTPUT_DIR="$WIRE_COMPATIBILITY_OUTPUT_DIR" \
            --env WIRE_COMPATIBILITY_SHARD_INDEX="$WIRE_COMPATIBILITY_SHARD_INDEX" \
            --env WIRE_COMPATIBILITY_SHARD_COUNT="$WIRE_COMPATIBILITY_SHARD_COUNT" \
            --entrypoint bash \
            wireloom-rti-7.7.0:local \
            -lc '
              version=$("$NDDSHOME/bin/rtiddsgen" -version 2>&1 | sed -n "s/.*rtiddsgen version //p" | head -n 1)
              if [[ "$version" != "4.7.0" ]]; then
                echo "Expected rtiddsgen 4.7.0 from the exact RTI 7.7.0 image." >&2
                exit 1
              fi
              bash tests/Wireloom.Dds.Generator.WireCompatibility/scripts/run-matrix.sh
            '

      - name: Save C++ compiler outputs
        if: always() && steps.ccache-cache.outcome == 'success' && steps.ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wireloom-cache/ccache
          key: ccache-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save NuGet packages
        if: always() && matrix.shard == 0 && steps.nuget-cache.outcome == 'success' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wireloom-cache/nuget
          key: nuget-linux-rti-${{ env.WIRE_COMPATIBILITY_RTI_VERSION }}-${{ hashFiles('Directory.Build.props', 'Directory.Packages.props', 'NuGet.config', 'global.json', 'src/Wireloom.Dds.Generator/Wireloom.Dds.Generator.csproj', 'tests/Wireloom.Dds.Generator.WireCompatibility/Wireloom.Dds.Generator.WireCompatibility.csproj') }}

      - name: Upload sanitized wire evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wire-compatibility-rti-7.7.0-shard-${{ matrix.shard }}
          path: |
            artifacts/wire-compatibility/results.json
            artifacts/wire-compatibility/results.md
            artifacts/wire-compatibility/logs/
            artifacts/wire-compatibility/scenarios.tsv
            artifacts/wire-compatibility/plan.json
            artifacts/wire-compatibility/shard.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove runtime license file
        if: always()
        run: rm -f "$RUNNER_TEMP/rti_license.dat"

  report:
    name: Combine wire matrix shards
    needs: rti-7-7-0
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wire-compatibility-rti-7.7.0-shard-*
          path: artifacts/wire-shards

      - name: Build matrix reporting utility
        run: >-
          dotnet build tests/Wireloom.Dds.Generator.WireCompatibility/scripts/matrix-tools.cs
          --output "$RUNNER_TEMP/matrix-tools" --verbosity quiet

      - name: Verify shard partitioning and merge integrity
        run: >-
          dotnet run --file tests/Wireloom.Dds.Generator.WireCompatibility/scripts/verify-shards.cs --
          "$RUNNER_TEMP/matrix-tools/matrix-tools.dll"

      - name: Verify harness setup failures remain failures
        run: bash tests/Wireloom.Dds.Generator.WireCompatibility/scripts/verify-harness.sh

      - name: Validate and combine all exchanges
        run: >-
          dotnet "$RUNNER_TEMP/matrix-tools/matrix-tools.dll"
          merge-shards 7.7.0 4 artifacts/wire-shards artifacts/wire-compatibility
          tests/Wireloom.Dds.Generator.WireCompatibility/wire-case-exclusions.json

      - name: Publish combined wire matrix summary
        if: always()
        shell: bash
        run: |
          report=artifacts/wire-compatibility/results.md
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Shard evidence could not be combined. Check shard setup and merge diagnostics." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload combined wire evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wire-compatibility-rti-7.7.0
          path: artifacts/wire-compatibility/
          if-no-files-found: warn
          retention-days: 14
