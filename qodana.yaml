version: "1.0"

linter: qodana-cdnet

profile:
  name: qodana.recommended
  inspections:
    - group: ALL
      ignore:
        - "docs/**"
        - "**/F_*.g.cs"
        - "**/M_*.g.cs"
        - "**/P_*.g.cs"
        - "**/T_*.g.cs"
        - "**/PolyfillExtensions.g.cs"

include:
  - name: CheckDependencyLicenses

dotnet:
  solution: Wireloom.slnx

bootstrap: |
  set -eu

  dotnet restore Wireloom.slnx --locked-mode
  dotnet build src/Wireloom.Dds.Compiler/Wireloom.Dds.Compiler.csproj --no-restore --configuration Release
